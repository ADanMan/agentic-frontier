<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">A leaked system prompt is text, not an enforced boundary</title>
  <desc id="desc">System prompts extracted across Anthropic, OpenAI, Google and xAI show the instruction is plain text in the context window; the real safety controls live outside it, in code.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 13px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .big { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 14px; font-weight: 600; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="20" y="20" width="230" height="70" rx="8" class="boxfill" />
  <text x="135" y="48" text-anchor="middle" class="txt">System prompt</text>
  <text x="135" y="70" text-anchor="middle" class="big">plain text, same context</text>

  <path d="M250,55 L370,55" class="arrow" />

  <rect x="370" y="20" width="250" height="70" rx="8" class="boxfill" />
  <text x="495" y="48" text-anchor="middle" class="txt">Extracted wholesale from</text>
  <text x="495" y="70" text-anchor="middle" class="big">Anthropic, OpenAI, Google, xAI</text>

  <path d="M495,90 L495,150" class="arrow" />

  <rect x="370" y="150" width="250" height="55" rx="8" class="box" />
  <text x="495" y="182" text-anchor="middle" class="txt">Leak ≠ bypassed defense</text>

  <path d="M370,177 L250,177" class="arrow" />

  <rect x="20" y="150" width="230" height="90" rx="8" class="boxfill" />
  <text x="135" y="172" text-anchor="middle" class="lbl">Real boundary lives here:</text>
  <text x="135" y="192" text-anchor="middle" class="txt">output classifiers,</text>
  <text x="135" y="210" text-anchor="middle" class="txt">server-side checks,</text>
  <text x="135" y="228" text-anchor="middle" class="txt">scoped tool permissions</text>
</svg>
