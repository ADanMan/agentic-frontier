<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Recursive self-improvement loop, per the paper's own definition</title>
  <desc id="desc">Experience and feedback during operation produce persistent changes. Those changes improve current capabilities, and separately improve the future improvement process itself, feeding back into more changes. The paper's method name, Headroom-Close, is mentioned but its mechanism is not described in the available abstract.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .boxdash { fill: none; stroke: currentColor; stroke-width: 2; stroke-dasharray: 5 4; opacity: 0.7; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="20" y="30" width="190" height="60" rx="8" class="boxfill" />
  <text x="115" y="55" text-anchor="middle" class="txt">Experience + feedback</text>
  <text x="115" y="72" text-anchor="middle" class="lbl">during operation</text>

  <path d="M210,60 L265,60" class="arrow" />

  <rect x="265" y="30" width="190" height="60" rx="8" class="box" />
  <text x="360" y="55" text-anchor="middle" class="txt">Persistent changes</text>
  <text x="360" y="72" text-anchor="middle" class="lbl">to the system itself</text>

  <path d="M330,90 L280,140" class="arrow" />
  <path d="M400,90 L460,140" class="arrow" />

  <rect x="180" y="140" width="160" height="55" rx="8" class="boxfill" />
  <text x="260" y="163" text-anchor="middle" class="txt" font-size="11">Improves current</text>
  <text x="260" y="180" text-anchor="middle" class="txt" font-size="11">capabilities</text>

  <rect x="400" y="140" width="180" height="55" rx="8" class="boxfill" />
  <text x="490" y="163" text-anchor="middle" class="txt" font-size="11">Improves the future</text>
  <text x="490" y="180" text-anchor="middle" class="txt" font-size="11">improvement process</text>

  <path d="M490,195 C490,225 360,225 360,90" class="arrow" />

  <rect x="20" y="140" width="130" height="55" rx="8" class="boxdash" />
  <text x="85" y="163" text-anchor="middle" class="lbl" font-size="10">"Headroom-Close…"</text>
  <text x="85" y="178" text-anchor="middle" class="lbl" font-size="10">mechanism unstated</text>

  <text x="320" y="235" text-anchor="middle" class="lbl">Loop structure is from the paper's own definition; method details cut off in the digest excerpt</text>
</svg>
