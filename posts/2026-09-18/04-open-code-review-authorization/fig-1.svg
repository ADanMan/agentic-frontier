<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Two possible architectures for deterministic rules plus an LLM agent</title>
  <desc id="desc">Option A: deterministic pipeline and LLM agent both publish comments to the pull request independently, in parallel. Option B: the deterministic pipeline gates the LLM agent's proposed comments before anything is published. The digest description does not confirm which option open-code-review actually implements.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .boxdash { fill: none; stroke: currentColor; stroke-width: 2; stroke-dasharray: 5 4; opacity: 0.7; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <text x="160" y="20" text-anchor="middle" class="lbl">Option A: parallel, no gate</text>
  <rect x="20" y="30" width="130" height="40" rx="6" class="boxfill" />
  <text x="85" y="54" text-anchor="middle" class="txt" font-size="11">Deterministic rules</text>
  <rect x="180" y="30" width="130" height="40" rx="6" class="boxfill" />
  <text x="245" y="54" text-anchor="middle" class="txt" font-size="11">LLM agent</text>
  <path d="M85,70 L130,110" class="arrow" />
  <path d="M245,70 L200,110" class="arrow" />
  <rect x="90" y="110" width="180" height="40" rx="6" class="box" />
  <text x="180" y="134" text-anchor="middle" class="txt" font-size="11">Both publish to PR directly</text>

  <text x="480" y="20" text-anchor="middle" class="lbl">Option B: rules gate the agent</text>
  <rect x="420" y="30" width="130" height="40" rx="6" class="boxdash" />
  <text x="485" y="54" text-anchor="middle" class="txt" font-size="11">LLM agent proposes</text>
  <path d="M485,70 L485,100" class="arrow" />
  <rect x="420" y="100" width="130" height="40" rx="6" class="boxfill" />
  <text x="485" y="124" text-anchor="middle" class="txt" font-size="11">Deterministic gate</text>
  <path d="M485,140 L485,170" class="arrow" />
  <rect x="420" y="170" width="130" height="40" rx="6" class="box" />
  <text x="485" y="194" text-anchor="middle" class="txt" font-size="11">Published to PR</text>

  <text x="320" y="240" text-anchor="middle" class="lbl">Which architecture open-code-review actually uses is not confirmed by the digest description</text>
</svg>
