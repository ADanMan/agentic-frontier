<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="title desc">
  <title id="title">One foundation model vs. many bespoke forecasters</title>
  <desc id="desc">Three separate time series each needing their own trained model, compared to three series sharing one pretrained foundation model that forecasts without fine-tuning.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .fm { fill: none; stroke: currentColor; stroke-width: 2.5; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 14px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; opacity: 0.7; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <text x="20" y="20" class="lbl">Классически / Classic</text>
  <rect x="20" y="30" width="90" height="34" rx="6" class="box" /><text x="65" y="52" text-anchor="middle" class="txt">Ряд A</text>
  <rect x="20" y="80" width="90" height="34" rx="6" class="box" /><text x="65" y="102" text-anchor="middle" class="txt">Ряд B</text>
  <rect x="20" y="130" width="90" height="34" rx="6" class="box" /><text x="65" y="152" text-anchor="middle" class="txt">Ряд C</text>

  <path d="M110,47 H160" class="arrow" />
  <path d="M110,97 H160" class="arrow" />
  <path d="M110,147 H160" class="arrow" />

  <rect x="160" y="30" width="110" height="34" rx="6" class="box" /><text x="215" y="52" text-anchor="middle" class="txt">Модель A</text>
  <rect x="160" y="80" width="110" height="34" rx="6" class="box" /><text x="215" y="102" text-anchor="middle" class="txt">Модель B</text>
  <rect x="160" y="130" width="110" height="34" rx="6" class="box" /><text x="215" y="152" text-anchor="middle" class="txt">Модель C</text>

  <line x1="20" y1="190" x2="640" y2="190" stroke="currentColor" stroke-width="1" opacity="0.25" />

  <text x="20" y="212" class="lbl">TimesFM / Foundation model</text>
  <rect x="20" y="222" width="90" height="34" rx="6" class="box" /><text x="65" y="244" text-anchor="middle" class="txt">Ряд A</text>
  <rect x="20" y="200" width="90" height="0" opacity="0" />

  <rect x="360" y="205" width="150" height="70" rx="10" class="fm" />
  <text x="435" y="235" text-anchor="middle" class="txt">TimesFM</text>
  <text x="435" y="253" text-anchor="middle" class="lbl">предобучена на</text>
  <text x="435" y="267" text-anchor="middle" class="lbl">множестве рядов</text>

  <path d="M110,239 H360" class="arrow" />
</svg>
