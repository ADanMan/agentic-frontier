<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Temporal memory vs. content-aware memory</title>
  <desc id="desc">A growing frame history feeding a finite attention window: temporal-only memory keeps recent frames and lets a character's appearance drift, while content-aware memory retains appearance features separately and keeps the look stable.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 14px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; opacity: 0.75; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="20" y="20" width="170" height="44" rx="8" class="box" />
  <text x="105" y="47" text-anchor="middle" class="txt">Растущая история</text>

  <path d="M190,42 H240" class="arrow" />
  <rect x="240" y="20" width="150" height="44" rx="8" class="box" />
  <text x="315" y="47" text-anchor="middle" class="txt">Окно внимания</text>

  <path d="M315,64 V95" class="arrow" />

  <rect x="200" y="95" width="230" height="34" rx="8" class="box" />
  <text x="315" y="117" text-anchor="middle" class="txt">Что сохранить?</text>

  <path d="M260,129 V160" class="arrow" />
  <rect x="60" y="160" width="200" height="44" rx="8" class="box" />
  <text x="160" y="182" text-anchor="middle" class="txt">Temporal:</text>
  <text x="160" y="198" text-anchor="middle" class="lbl">последние кадры</text>

  <path d="M160,204 V230" class="arrow" />
  <text x="160" y="248" text-anchor="middle" class="lbl">внешний вид «плывёт»</text>

  <path d="M370,129 V160" class="arrow" />
  <rect x="380" y="160" width="220" height="44" rx="8" class="box" />
  <text x="490" y="182" text-anchor="middle" class="txt">RECAP-Forcing:</text>
  <text x="490" y="198" text-anchor="middle" class="lbl">appearance отдельно</text>

  <path d="M490,204 V230" class="arrow" />
  <text x="490" y="248" text-anchor="middle" class="lbl">вид остаётся стабильным</text>
</svg>
