<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="title desc">
  <title id="title">Two sources of agent skills, and where the abstract cuts off</title>
  <desc id="desc">Trajectory-based synthesis derives skills from execution logs; the paper's approach synthesizes skills grounded in code, at scale. The digest's abstract excerpt names two limitations of existing methods but is truncated right after naming the first, trajectory-based synthesis, leaving the second limitation unknown.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 10px; opacity: 0.75; }
    .dash { stroke: currentColor; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; opacity: 0.6; marker-end: url(#arrow); }
    .arr { stroke: currentColor; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="20" y="20" width="220" height="60" rx="6" class="box" />
  <text x="130" y="42" text-anchor="middle" class="txt">Trajectory-based synthesis</text>
  <text x="130" y="60" text-anchor="middle" class="lbl">skills built from execution logs</text>

  <path d="M240,50 L295,50" class="arr" />

  <rect x="300" y="20" width="220" height="60" rx="6" class="boxfill" />
  <text x="410" y="42" text-anchor="middle" class="txt">"Two limitations"</text>
  <text x="410" y="60" text-anchor="middle" class="lbl">first one named above</text>

  <path d="M520,50 L565,50" class="dash" />
  <text x="565" y="35" class="lbl">?</text>
  <rect x="540" y="20" width="80" height="60" rx="6" class="box" style="stroke-dasharray:4 4" />
  <text x="580" y="55" text-anchor="middle" class="lbl">2nd limit:</text>
  <text x="580" y="68" text-anchor="middle" class="lbl">not given</text>

  <text x="410" y="105" text-anchor="middle" class="lbl">— abstract excerpt in the digest stops right here —</text>

  <rect x="130" y="140" width="380" height="60" rx="6" class="box" />
  <text x="320" y="163" text-anchor="middle" class="txt">This paper: grounded synthesis from code, at scale</text>
  <text x="320" y="182" text-anchor="middle" class="lbl">code as the source instead of / alongside traces</text>

  <path d="M320,200 L320,235" class="arr" />

  <rect x="220" y="240" width="200" height="30" rx="6" class="boxfill" />
  <text x="320" y="260" text-anchor="middle" class="txt">Reusable agent skill</text>
</svg>
