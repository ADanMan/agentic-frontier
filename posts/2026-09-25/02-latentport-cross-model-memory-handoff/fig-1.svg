<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Two paths for handing context to a bigger model</title>
  <desc id="desc">A 4B model builds a hybrid state while reading long context. The classic path replays that whole context through a 9B model, which is slow and costly. LatentPort instead hands the hybrid state directly to the 9B sibling, skipping the replay, demonstrated on one architecture-matched Qwen3.5 4B-to-9B pair.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .dash { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-dasharray: 5 4; opacity: 0.6; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>

  <rect x="20" y="20" width="180" height="55" rx="8" class="boxfill" />
  <text x="110" y="45" text-anchor="middle" class="txt">Qwen3.5 4B</text>
  <text x="110" y="62" text-anchor="middle" class="lbl">builds hybrid state</text>

  <line x1="200" y1="47" x2="300" y2="47" class="box" marker-end="url(#arrow)" />
  <text x="250" y="38" text-anchor="middle" class="lbl">handoff</text>

  <rect x="300" y="20" width="200" height="55" rx="8" class="boxfill" />
  <text x="400" y="45" text-anchor="middle" class="txt">Qwen3.5 9B</text>
  <text x="400" y="62" text-anchor="middle" class="lbl">receives state directly</text>

  <line x1="110" y1="75" x2="110" y2="140" class="dash" />
  <rect x="20" y="140" width="260" height="55" rx="8" class="box" />
  <text x="150" y="163" text-anchor="middle" class="lbl">classic path:</text>
  <text x="150" y="180" text-anchor="middle" class="txt">9B rereads full context prefix</text>

  <line x1="150" y1="195" x2="150" y2="220" class="dash" />
  <text x="150" y="235" text-anchor="middle" class="lbl">cost scales with context length</text>

  <text x="480" y="120" text-anchor="middle" class="lbl">one architecture-matched</text>
  <text x="480" y="135" text-anchor="middle" class="lbl">sibling pair, demonstrated once</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="currentColor" />
    </marker>
  </defs>
</svg>
