<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="title desc">
  <title id="title">One trending card, two disagreeing numbers</title>
  <desc id="desc">hindsight gained 77 stars by window difference (27,715 to 27,792) but the same card also shows 1,668 stars today, a 21.7x gap. This is the fourth such mismatch logged from GitHub trending cards, and the largest so far.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>

  <rect x="20" y="60" width="260" height="90" rx="8" class="boxfill" />
  <text x="150" y="90" text-anchor="middle" class="txt">27,715 → 27,792 stars</text>
  <text x="150" y="110" text-anchor="middle" class="lbl">window diff: +77</text>
  <text x="150" y="130" text-anchor="middle" class="lbl">hindsight, Python, rank #2</text>

  <text x="320" y="30" text-anchor="middle" class="txt">Same card, same day</text>
  <text x="320" y="105" text-anchor="middle" class="lbl">~21.7x gap</text>

  <rect x="360" y="60" width="260" height="90" rx="8" class="box" />
  <text x="490" y="90" text-anchor="middle" class="txt">"1,668 stars today"</text>
  <text x="490" y="110" text-anchor="middle" class="lbl">separate field,</text>
  <text x="490" y="130" text-anchor="middle" class="lbl">same repository</text>

  <text x="320" y="195" text-anchor="middle" class="txt">4th confirmed mismatch of this kind — the largest gap yet</text>
</svg>
