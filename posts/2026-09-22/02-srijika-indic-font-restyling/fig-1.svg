<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
  <title id="title">Srijika reuses shaping tables, restyles only the glyph outlines</title>
  <desc id="desc">A shaping-complete template font already has validated GSUB/GPOS logic for a Brahmic script. Srijika restyles the glyph outlines on top of that template instead of generating a new font, with its shaping logic, from scratch.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .dash { stroke: currentColor; stroke-width: 2; fill: none; stroke-dasharray: 5 4; opacity: 0.55; }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="10" y="20" width="190" height="80" rx="8" class="box" />
  <text x="105" y="45" text-anchor="middle" class="txt">Template font</text>
  <text x="105" y="63" text-anchor="middle" class="lbl">shaping-complete</text>
  <text x="105" y="79" text-anchor="middle" class="lbl">GSUB/GPOS already valid</text>

  <path d="M200,60 L255,60" class="arrow" />

  <rect x="255" y="15" width="180" height="90" rx="8" class="boxfill" />
  <text x="345" y="40" text-anchor="middle" class="txt">Srijika restyle</text>
  <text x="345" y="58" text-anchor="middle" class="lbl">glyph outlines change</text>
  <text x="345" y="74" text-anchor="middle" class="lbl">shaping tables reused,</text>
  <text x="345" y="90" text-anchor="middle" class="lbl">not rebuilt</text>

  <path d="M435,60 L490,60" class="arrow" />

  <rect x="490" y="20" width="140" height="80" rx="8" class="box" />
  <text x="560" y="45" text-anchor="middle" class="txt">Installable</text>
  <text x="560" y="62" text-anchor="middle" class="txt">OpenType font</text>
  <text x="560" y="80" text-anchor="middle" class="lbl">9 Brahmic scripts</text>

  <path d="M105,100 L105,160" class="dash" />
  <rect x="10" y="160" width="290" height="55" rx="8" class="box" />
  <text x="155" y="182" text-anchor="middle" class="lbl">Skipped path: generating a new font</text>
  <text x="155" y="200" text-anchor="middle" class="lbl">— and its shaping logic — from scratch</text>

  <text x="320" y="232" text-anchor="middle" class="lbl">The hard part (shaping) is reused; only visual style changes</text>
</svg>
