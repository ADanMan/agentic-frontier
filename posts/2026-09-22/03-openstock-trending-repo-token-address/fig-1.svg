<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
  <title id="title">Two independent facts about the same README</title>
  <desc id="desc">The README opens with a Solana token contract address before the project name. Further down it lists a real, working tech stack: Next.js, TypeScript, MongoDB, Finnhub, TradingView. Neither fact cancels the other.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="220" y="10" width="200" height="50" rx="8" class="box" />
  <text x="320" y="30" text-anchor="middle" class="txt">README, line 1</text>
  <text x="320" y="47" text-anchor="middle" class="lbl">Solana token contract address</text>

  <path d="M320,60 L320,95" class="arrow" />

  <rect x="220" y="95" width="200" height="45" rx="8" class="boxfill" />
  <text x="320" y="118" text-anchor="middle" class="lbl">...then title, description, stack</text>

  <path d="M120,150 L220,120" class="arrow" />
  <path d="M520,150 L420,120" class="arrow" />

  <rect x="10" y="150" width="220" height="70" rx="8" class="boxfill" />
  <text x="120" y="172" text-anchor="middle" class="txt">Real product</text>
  <text x="120" y="190" text-anchor="middle" class="lbl">Next.js, MongoDB, Finnhub,</text>
  <text x="120" y="205" text-anchor="middle" class="lbl">TradingView, working features</text>

  <rect x="410" y="150" width="220" height="70" rx="8" class="boxfill" />
  <text x="520" y="172" text-anchor="middle" class="txt">Attention funnel</text>
  <text x="520" y="190" text-anchor="middle" class="lbl">trending badges highlight</text>
  <text x="520" y="205" text-anchor="middle" class="lbl">rank + star velocity</text>

  <text x="320" y="235" text-anchor="middle" class="lbl">Both true at once — stars alone tell you neither</text>
</svg>
