<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Mutation analysis measures the checker, not the code</title>
  <desc id="desc">Normal flow: an LLM-generated GPU kernel passes a checker with a few random inputs and a loose tolerance, feeding a leaderboard and an RL reward. Mutation analysis instead asks whether the checker catches deliberately broken mutant versions of the code.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .dash { stroke: currentColor; stroke-width: 2; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); opacity: 0.7; }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="10" y="20" width="150" height="60" rx="8" class="boxfill" />
  <text x="85" y="45" text-anchor="middle" class="txt">LLM writes</text>
  <text x="85" y="62" text-anchor="middle" class="txt">GPU kernel</text>

  <path d="M160,50 L215,50" class="arrow" />

  <rect x="215" y="15" width="200" height="90" rx="8" class="box" />
  <text x="315" y="40" text-anchor="middle" class="txt">Checker (oracle)</text>
  <text x="315" y="58" text-anchor="middle" class="lbl">few random inputs</text>
  <text x="315" y="74" text-anchor="middle" class="lbl">+ loose float tolerance</text>

  <path d="M415,50 L470,50" class="arrow" />

  <rect x="470" y="20" width="160" height="60" rx="8" class="boxfill" />
  <text x="550" y="42" text-anchor="middle" class="txt">Leaderboard</text>
  <text x="550" y="59" text-anchor="middle" class="txt">+ RL reward</text>

  <path d="M315,105 L315,150" class="dash" />
  <text x="335" y="130" class="lbl">measures the checker</text>

  <rect x="165" y="150" width="300" height="80" rx="8" class="boxfill" />
  <text x="315" y="175" text-anchor="middle" class="txt">Mutation analysis</text>
  <text x="315" y="195" text-anchor="middle" class="lbl">inject deliberate synthetic bugs</text>
  <text x="315" y="211" text-anchor="middle" class="lbl">does the checker catch the mutant?</text>

  <text x="320" y="250" text-anchor="middle" class="lbl">A checker that misses broken mutants proves nothing about correct code</text>
</svg>
