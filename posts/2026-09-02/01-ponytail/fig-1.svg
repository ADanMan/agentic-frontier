<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Decision funnel: write less code</title>
  <desc id="desc">A funnel showing an agent first asking whether new code is needed at all, then whether a minimal diff suffices, before writing a full change.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 15px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 13px; opacity: 0.75; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="20" y="20" width="160" height="50" rx="8" class="box" />
  <text x="100" y="50" text-anchor="middle" class="txt">Задача / Task</text>

  <path d="M180,45 H240" class="arrow" />

  <rect x="240" y="20" width="200" height="50" rx="8" class="box" />
  <text x="340" y="42" text-anchor="middle" class="txt">Можно вообще</text>
  <text x="340" y="60" text-anchor="middle" class="txt">не писать код?</text>

  <path d="M340,70 V110" class="arrow" />
  <text x="352" y="95" class="lbl">нет</text>

  <rect x="240" y="110" width="200" height="50" rx="8" class="box" />
  <text x="340" y="132" text-anchor="middle" class="txt">Хватит минимального</text>
  <text x="340" y="150" text-anchor="middle" class="txt">диффа?</text>

  <path d="M340,160 V200" class="arrow" />
  <text x="352" y="185" class="lbl">нет</text>

  <rect x="240" y="200" width="200" height="40" rx="8" class="box" />
  <text x="340" y="225" text-anchor="middle" class="txt">Полноценное решение</text>

  <path d="M180,45 C 500,45 500,225 440,225" class="arrow" />
  <text x="500" y="35" class="lbl" text-anchor="middle">да → ничего не писать</text>

  <path d="M440,135 C 560,135 560,225 440,220" class="arrow" />
  <text x="560" y="125" class="lbl" text-anchor="middle">да → минимум</text>
</svg>
