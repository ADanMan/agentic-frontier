<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="VoiceStudio takes reference audio or a text description, synthesizes a voice locally, and outputs dubbing, audiobooks, transcription, or an agent-facing MCP tool">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: none; stroke: #6b7280; stroke-width: 1.5; }
    .hub { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .out { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.2; }
    .mcp { fill: #ecfdf5; stroke: #059669; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .title { font: 600 15px sans-serif; fill: #111827; }
    .label { font: 12px sans-serif; fill: #374151; }
    .small { font: 11px sans-serif; fill: #6b7280; }
    .arrow { stroke: #6b7280; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
    .arrowg { stroke: #059669; stroke-width: 1.3; fill: none; marker-end: url(#arrowg); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111827; }
      .box { stroke: #9ca3af; }
      .hub { fill: #1e3a5f; stroke: #60a5fa; }
      .out { fill: #1f2937; stroke: #9ca3af; }
      .mcp { fill: #052e21; stroke: #34d399; }
      .title { fill: #f3f4f6; }
      .label { fill: #d1d5db; }
      .small { fill: #9ca3af; }
      .arrow { stroke: #9ca3af; }
      .arrowg { stroke: #34d399; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#059669"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="640" height="400"/>

  <rect class="out" x="20" y="40" width="150" height="40" rx="6"/>
  <text class="label" x="33" y="65">Референс-аудио</text>

  <rect class="out" x="20" y="100" width="150" height="40" rx="6"/>
  <text class="label" x="33" y="125">Описание голоса</text>

  <path class="arrow" d="M170,60 L235,150"/>
  <path class="arrow" d="M170,120 L235,165"/>

  <rect class="hub" x="235" y="130" width="150" height="60" rx="8"/>
  <text class="title" x="250" y="155">VoiceStudio</text>
  <text class="small" x="250" y="175">локальный движок</text>

  <path class="arrow" d="M385,145 L460,50"/>
  <path class="arrow" d="M385,158 L460,110"/>
  <path class="arrow" d="M385,172 L460,225"/>
  <path class="arrow" d="M385,182 L460,285"/>
  <path class="arrowg" d="M385,192 L460,340"/>

  <rect class="out" x="460" y="30" width="160" height="40" rx="6"/>
  <text class="label" x="473" y="55">Дубляж видео</text>

  <rect class="out" x="460" y="90" width="160" height="40" rx="6"/>
  <text class="label" x="473" y="115">Аудиокниги</text>

  <rect class="out" x="460" y="205" width="160" height="40" rx="6"/>
  <text class="label" x="473" y="230">Диктовка / транскрипция</text>

  <rect class="out" x="460" y="265" width="160" height="40" rx="6"/>
  <text class="label" x="473" y="290">Прямой синтез</text>

  <rect class="mcp" x="460" y="320" width="160" height="40" rx="6"/>
  <text class="label" x="473" y="345">MCP → AI-агенты</text>

  <rect class="box" x="20" y="330" width="380" height="55" rx="8"/>
  <text class="small" x="33" y="350">AGPL-3.0 (приложение) · модели — своя лицензия каждая</text>
  <text class="small" x="33" y="368">Облако — опционально и с согласия; клонирование чужого голоса — с разрешения</text>
</svg>
