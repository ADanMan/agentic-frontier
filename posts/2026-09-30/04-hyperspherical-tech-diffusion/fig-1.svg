<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Official productivity statistics lag years behind; preprints, patents and compute scaling move in near real time">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: none; stroke: #6b7280; stroke-width: 1.5; }
    .slow { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.2; }
    .fast { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
    .title { font: 600 15px sans-serif; fill: #111827; }
    .label { font: 12px sans-serif; fill: #374151; }
    .small { font: 11px sans-serif; fill: #6b7280; }
    .axis { stroke: #6b7280; stroke-width: 1.2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111827; }
      .box { stroke: #9ca3af; }
      .slow { fill: #3f1d1d; stroke: #f87171; }
      .fast { fill: #14321f; stroke: #4ade80; }
      .title { fill: #f3f4f6; }
      .label { fill: #d1d5db; }
      .small { fill: #9ca3af; }
      .axis { stroke: #9ca3af; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="640" height="380"/>

  <line class="axis" x1="60" y1="300" x2="600" y2="300"/>
  <text class="small" x="560" y="320">время →</text>

  <text class="title" x="60" y="40">Total Factor Productivity</text>
  <rect class="slow" x="60" y="55" width="540" height="30" rx="6"/>
  <text class="label" x="75" y="76">отчёт публикуется с лагом в годы (циклы обследований, нацсчета)</text>

  <text class="title" x="60" y="130">Препринты + патенты + compute scaling</text>
  <rect class="fast" x="60" y="145" width="540" height="30" rx="6"/>
  <text class="label" x="75" y="166">сигнал появляется почти в реальном времени</text>

  <rect class="box" x="60" y="210" width="540" height="150" rx="8"/>
  <text class="small" x="75" y="235">Hyperspherical Semantic Trajectory Analysis: те же прорывы отслеживаются</text>
  <text class="small" x="75" y="255">через траектории в пространстве эмбеддингов — препринт → патентная заявка →</text>
  <text class="small" x="75" y="275">рост вычислительных мощностей, — а не через ежегодную статистику TFP.</text>
  <text class="small" x="75" y="300">Что дайджест НЕ говорит: точность метода, проверка на исторических данных,</text>
  <text class="small" x="75" y="320">степень корреляции с реальной поздней TFP. Постановка вопроса — не результат.</text>
  <text class="small" x="75" y="345">By Muhammad Sukri Bin Ramli</text>
</svg>
