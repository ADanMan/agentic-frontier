<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="OpenShell sits between an autonomous agent and the host system, mediating every action">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: none; stroke: #6b7280; stroke-width: 1.5; }
    .hub { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .danger { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
    .safe { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
    .title { font: 600 15px sans-serif; fill: #111827; }
    .label { font: 12px sans-serif; fill: #374151; }
    .small { font: 11px sans-serif; fill: #6b7280; }
    .arrow { stroke: #6b7280; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111827; }
      .box { stroke: #9ca3af; }
      .hub { fill: #1e3a5f; stroke: #60a5fa; }
      .danger { fill: #3f1d1d; stroke: #f87171; }
      .safe { fill: #14321f; stroke: #4ade80; }
      .title { fill: #f3f4f6; }
      .label { fill: #d1d5db; }
      .small { fill: #9ca3af; }
      .arrow { stroke: #9ca3af; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="640" height="360"/>

  <rect class="box" x="20" y="60" width="150" height="60" rx="8"/>
  <text class="title" x="35" y="85">Autonomous</text>
  <text class="title" x="35" y="103">agent</text>

  <path class="arrow" d="M170,90 L245,90"/>
  <text class="small" x="175" y="80">proposes an action</text>

  <rect class="hub" x="245" y="40" width="150" height="100" rx="8"/>
  <text class="title" x="260" y="70">OpenShell</text>
  <text class="label" x="260" y="92">runtime boundary</text>
  <text class="label" x="260" y="110">(Rust)</text>

  <path class="arrow" d="M395,70 L470,45"/>
  <rect class="safe" x="470" y="20" width="150" height="50" rx="8"/>
  <text class="label" x="483" y="42">allowed:</text>
  <text class="label" x="483" y="58">scoped file / net call</text>

  <path class="arrow" d="M395,110 L470,145"/>
  <rect class="danger" x="470" y="120" width="150" height="50" rx="8"/>
  <text class="label" x="483" y="142">blocked:</text>
  <text class="label" x="483" y="158">unscoped host access</text>

  <rect class="box" x="20" y="200" width="600" height="130" rx="8"/>
  <text class="small" x="35" y="225">The pitch: a runtime that mediates every action an autonomous agent takes,</text>
  <text class="small" x="35" y="245">instead of trusting the agent to self-limit its own file, network and process access.</text>
  <text class="small" x="35" y="270">GitHub trending #2: 10,522 → 10,983 stars (+461 in one day), Rust.</text>
  <text class="small" x="35" y="292">Open question the README doesn't answer yet: is the policy engine independently</text>
  <text class="small" x="35" y="312">audited, or is "safe, private runtime" a claim made by the same project shipping it?</text>
</svg>
