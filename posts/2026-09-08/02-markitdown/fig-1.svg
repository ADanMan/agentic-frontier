<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .highlight { fill: none; stroke: currentColor; stroke-width: 2.5; }
    .txt { fill: currentColor; font-size: 13px; }
    .lbl { fill: currentColor; font-size: 11px; opacity: 0.75; }
    .arrow { stroke: currentColor; stroke-width: 1.2; fill: none; marker-end: url(#arrow7); opacity: 0.85; }
    svg { color: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e6e6e6; }
    }
  </style>
  <defs>
    <marker id="arrow7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="150" height="50" class="box" rx="8"/>
  <text x="95" y="40" text-anchor="middle" class="txt" font-size="12">.docx / .pdf</text>
  <text x="95" y="58" text-anchor="middle" class="txt" font-size="12">.pptx / .xlsx</text>

  <rect x="245" y="20" width="150" height="50" class="highlight" rx="8"/>
  <text x="320" y="50" text-anchor="middle" class="txt">markitdown</text>

  <rect x="470" y="20" width="150" height="50" class="box" rx="8"/>
  <text x="545" y="50" text-anchor="middle" class="txt" font-size="12">Чистый Markdown</text>

  <path d="M170,45 L245,45" class="arrow"/>
  <path d="M395,45 L470,45" class="arrow"/>

  <rect x="470" y="120" width="150" height="45" class="box" rx="8"/>
  <text x="545" y="147" text-anchor="middle" class="txt" font-size="12">Чанкинг</text>
  <path d="M545,70 L545,120" class="arrow"/>

  <rect x="470" y="195" width="150" height="45" class="box" rx="8"/>
  <text x="545" y="222" text-anchor="middle" class="txt" font-size="12">Эмбеддинги</text>
  <path d="M545,165 L545,195" class="arrow"/>

  <rect x="20" y="120" width="330" height="60" class="box" rx="8"/>
  <text x="185" y="143" text-anchor="middle" class="txt" font-size="12">Таблицы, сноски, вложенные объекты</text>
  <text x="185" y="163" text-anchor="middle" class="lbl">теряются здесь — теряются везде дальше</text>
  <path d="M170,45 L185,120" class="arrow" stroke-dasharray="4 3"/>

  <text x="320" y="270" text-anchor="middle" class="lbl">markitdown задаёт потолок качества всего, что после него</text>
</svg>
