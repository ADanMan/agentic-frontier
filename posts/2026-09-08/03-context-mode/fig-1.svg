<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .highlight { fill: none; stroke: currentColor; stroke-width: 2.5; }
    .txt { fill: currentColor; font-size: 13px; }
    .lbl { fill: currentColor; font-size: 11px; opacity: 0.75; }
    .arrow { stroke: currentColor; stroke-width: 1.2; fill: none; marker-end: url(#arrow8); opacity: 0.85; }
    svg { color: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e6e6e6; }
    }
  </style>
  <defs>
    <marker id="arrow8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="20" y="30" width="150" height="50" class="box" rx="8"/>
  <text x="95" y="60" text-anchor="middle" class="txt" font-size="12">Вызов инструмента</text>

  <rect x="230" y="30" width="150" height="50" class="box" rx="8"/>
  <text x="305" y="52" text-anchor="middle" class="txt" font-size="12">Сырой вывод</text>
  <text x="305" y="70" text-anchor="middle" class="lbl">логи, дифы, JSON</text>

  <path d="M170,55 L230,55" class="arrow"/>

  <rect x="440" y="30" width="170" height="50" class="highlight" rx="8"/>
  <text x="525" y="52" text-anchor="middle" class="txt" font-size="12">Sandboxing</text>
  <text x="525" y="70" text-anchor="middle" class="lbl">заявлено: -98% токенов</text>

  <path d="M380,55 L440,55" class="arrow"/>

  <rect x="20" y="140" width="230" height="50" class="box" rx="8"/>
  <text x="135" y="162" text-anchor="middle" class="txt" font-size="12">Session memory</text>
  <text x="135" y="180" text-anchor="middle" class="lbl">персистится между запусками</text>

  <rect x="290" y="140" width="320" height="50" class="box" rx="8"/>
  <text x="450" y="162" text-anchor="middle" class="txt" font-size="12">Routing: MCP + hooks</text>
  <text x="450" y="180" text-anchor="middle" class="lbl">across 17 платформ</text>

  <path d="M135,140 L135,105 L525,105 L525,80" class="arrow"/>
  <path d="M450,140 L525,105" class="arrow" stroke-dasharray="4 3"/>

  <text x="320" y="250" text-anchor="middle" class="lbl">98% — цифра из README, не из независимого бенчмарка</text>
</svg>
