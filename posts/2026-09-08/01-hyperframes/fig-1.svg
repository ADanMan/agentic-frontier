<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .highlight { fill: none; stroke: currentColor; stroke-width: 2.5; }
    .txt { fill: currentColor; font-size: 13px; }
    .lbl { fill: currentColor; font-size: 11px; opacity: 0.75; }
    .arrow { stroke: currentColor; stroke-width: 1.2; fill: none; marker-end: url(#arrow6); opacity: 0.85; }
    svg { color: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e6e6e6; }
    }
  </style>
  <defs>
    <marker id="arrow6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="230" y="15" width="180" height="44" class="box" rx="8"/>
  <text x="320" y="42" text-anchor="middle" class="txt">Агенту нужно видео</text>

  <rect x="30" y="110" width="230" height="60" class="box" rx="8"/>
  <text x="145" y="133" text-anchor="middle" class="txt" font-size="12">Диффузионная модель</text>
  <text x="145" y="153" text-anchor="middle" class="lbl">пиксели напрямую, дорого</text>

  <rect x="380" y="110" width="230" height="60" class="highlight" rx="8"/>
  <text x="495" y="133" text-anchor="middle" class="txt" font-size="12">hyperframes</text>
  <text x="495" y="153" text-anchor="middle" class="lbl">агент пишет HTML</text>

  <path d="M270,59 L145,110" class="arrow"/>
  <path d="M370,59 L495,110" class="arrow"/>

  <rect x="380" y="220" width="230" height="60" class="box" rx="8"/>
  <text x="495" y="243" text-anchor="middle" class="txt" font-size="12">Детерминированный рендер</text>
  <text x="495" y="263" text-anchor="middle" class="lbl">HTML → видео, воспроизводимо</text>

  <path d="M495,170 L495,220" class="arrow"/>

  <text x="320" y="305" text-anchor="middle" class="lbl">та же логика, что уже победила для диаграмм: разметка вместо пикселей</text>
</svg>
