<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .txt { fill: currentColor; font-size: 14px; }
    .lbl { fill: currentColor; font-size: 12px; opacity: 0.75; }
    .arrow { stroke: currentColor; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    svg { color: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e6e6e6; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="20" y="30" width="130" height="36" class="box" rx="6"/>
  <text x="85" y="53" text-anchor="middle" class="txt">Запрос 1</text>

  <rect x="20" y="90" width="130" height="36" class="box" rx="6"/>
  <text x="85" y="113" text-anchor="middle" class="txt">Запрос 2</text>

  <rect x="20" y="150" width="130" height="36" class="box" rx="6"/>
  <text x="85" y="173" text-anchor="middle" class="txt">Запрос N</text>

  <rect x="210" y="90" width="150" height="60" class="box" rx="6"/>
  <text x="285" y="115" text-anchor="middle" class="txt">Очередь /</text>
  <text x="285" y="135" text-anchor="middle" class="txt">батчинг</text>

  <rect x="420" y="90" width="150" height="60" class="box" rx="6"/>
  <text x="495" y="115" text-anchor="middle" class="txt">Serving-слой</text>
  <text x="495" y="135" text-anchor="middle" class="txt">(SGLang)</text>

  <rect x="420" y="200" width="150" height="60" class="box" rx="6"/>
  <text x="495" y="225" text-anchor="middle" class="txt">GPU</text>
  <text x="495" y="245" text-anchor="middle" class="lbl">общий проход</text>

  <path d="M150,48 L210,110" class="arrow"/>
  <path d="M150,108 L210,115" class="arrow"/>
  <path d="M150,168 L210,125" class="arrow"/>

  <path d="M360,120 L420,120" class="arrow"/>
  <path d="M495,150 L495,200" class="arrow"/>

  <text x="285" y="270" text-anchor="middle" class="lbl">много запросов → один эффективный проход, а не N отдельных</text>
</svg>
