<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .center { fill: none; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-size: 13px; }
    .lbl { fill: currentColor; font-size: 12px; opacity: 0.75; }
    .arrow { stroke: currentColor; stroke-width: 1.2; fill: none; marker-end: url(#arrow2); opacity: 0.85; }
    svg { color: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e6e6e6; }
    }
  </style>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="230" y="20" width="180" height="50" class="center" rx="8"/>
  <text x="320" y="40" text-anchor="middle" class="txt">ECC</text>
  <text x="320" y="58" text-anchor="middle" class="lbl">harness optimizer</text>

  <rect x="20" y="120" width="110" height="40" class="box" rx="6"/>
  <text x="75" y="145" text-anchor="middle" class="txt">Skills</text>

  <rect x="150" y="120" width="110" height="40" class="box" rx="6"/>
  <text x="205" y="145" text-anchor="middle" class="txt">Instincts</text>

  <rect x="280" y="120" width="110" height="40" class="box" rx="6"/>
  <text x="335" y="145" text-anchor="middle" class="txt">Memory</text>

  <rect x="410" y="120" width="110" height="40" class="box" rx="6"/>
  <text x="465" y="145" text-anchor="middle" class="txt">Security</text>

  <rect x="510" y="120" width="115" height="40" class="box" rx="6"/>
  <text x="567" y="138" text-anchor="middle" class="txt" font-size="11">Research-first</text>
  <text x="567" y="152" text-anchor="middle" class="txt" font-size="11">development</text>

  <path d="M320,70 L75,120" class="arrow"/>
  <path d="M320,70 L205,120" class="arrow"/>
  <path d="M320,70 L335,120" class="arrow"/>
  <path d="M320,70 L465,120" class="arrow"/>
  <path d="M320,70 L567,120" class="arrow"/>

  <rect x="150" y="220" width="340" height="60" class="box" rx="8"/>
  <text x="320" y="245" text-anchor="middle" class="txt">Claude Code · Codex · Opencode · Cursor</text>
  <text x="320" y="265" text-anchor="middle" class="lbl">разные модели разрешений и tool API</text>

  <path d="M75,160 L200,220" class="arrow"/>
  <path d="M205,160 L260,220" class="arrow"/>
  <path d="M335,160 L335,220" class="arrow"/>
  <path d="M465,160 L400,220" class="arrow"/>
  <path d="M567,160 L440,220" class="arrow"/>

  <text x="320" y="315" text-anchor="middle" class="lbl">один security-слой поверх четырёх разных харнессов — обещание, не гарантия</text>
</svg>
