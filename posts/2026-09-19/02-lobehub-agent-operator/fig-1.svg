<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">LobeHub's four subsystems behind the "Chief Agent Operator" tagline</title>
  <desc id="desc">A tagline box, "Chief Agent Operator: hiring, scheduling, reporting", points down with a dashed marketing arrow to four concrete described subsystems: Operator (IM gateway, centralized management), Create (agent builder, 10000+ tools, MCP), Collaborate (Agent Groups, scheduled runs), Evolve (structured editable memory).</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 10px; opacity: 0.75; }
    .dash { stroke: currentColor; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; opacity: 0.6; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="150" y="15" width="340" height="45" rx="8" class="boxfill" />
  <text x="320" y="33" text-anchor="middle" class="txt">"Chief Agent Operator"</text>
  <text x="320" y="49" text-anchor="middle" class="lbl">hiring · scheduling · reporting</text>

  <path d="M320,60 L320,90" class="dash" />
  <text x="335" y="80" class="lbl">marketing layer</text>

  <rect x="20" y="100" width="140" height="70" rx="6" class="box" />
  <text x="90" y="122" text-anchor="middle" class="txt">Operator</text>
  <text x="90" y="140" text-anchor="middle" class="lbl">IM gateway,</text>
  <text x="90" y="153" text-anchor="middle" class="lbl">central management</text>

  <rect x="175" y="100" width="140" height="70" rx="6" class="box" />
  <text x="245" y="122" text-anchor="middle" class="txt">Create</text>
  <text x="245" y="140" text-anchor="middle" class="lbl">agent builder,</text>
  <text x="245" y="153" text-anchor="middle" class="lbl">10,000+ tools, MCP</text>

  <rect x="330" y="100" width="140" height="70" rx="6" class="box" />
  <text x="400" y="122" text-anchor="middle" class="txt">Collaborate</text>
  <text x="400" y="140" text-anchor="middle" class="lbl">Agent Groups,</text>
  <text x="400" y="153" text-anchor="middle" class="lbl">scheduled runs</text>

  <rect x="485" y="100" width="140" height="70" rx="6" class="box" />
  <text x="555" y="122" text-anchor="middle" class="txt">Evolve</text>
  <text x="555" y="140" text-anchor="middle" class="lbl">structured,</text>
  <text x="555" y="153" text-anchor="middle" class="lbl">editable memory</text>

  <text x="320" y="200" text-anchor="middle" class="lbl">Described in the README — no benchmark given for the "24/7 orchestration" claim itself</text>
</svg>
