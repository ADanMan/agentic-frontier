<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Two paths to extend a linear-attention model's context window</title>
  <desc id="desc">A model trained at one context length needs a longer working context. The standard path is continued pretraining on long sequences, which is expensive. SpectralShift proposes spectral reparameterization of already-trained parameters instead, with the exact mechanism not disclosed in the available abstract.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .boxdash { fill: none; stroke: currentColor; stroke-width: 2; stroke-dasharray: 5 4; opacity: 0.7; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 10px; opacity: 0.7; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="20" y="100" width="170" height="60" rx="8" class="boxfill" />
  <text x="105" y="125" text-anchor="middle" class="txt">Model trained at</text>
  <text x="105" y="141" text-anchor="middle" class="txt">short context length</text>

  <path d="M190,130 L230,130" class="arrow" />

  <rect x="230" y="100" width="150" height="60" rx="8" class="box" />
  <text x="305" y="125" text-anchor="middle" class="txt">Need longer</text>
  <text x="305" y="141" text-anchor="middle" class="txt">working context</text>

  <path d="M380,120 L440,60" class="arrow" />
  <path d="M380,140 L440,200" class="arrow" />

  <rect x="440" y="25" width="180" height="60" rx="8" class="box" />
  <text x="530" y="50" text-anchor="middle" class="txt">Continued pretraining</text>
  <text x="530" y="66" text-anchor="middle" class="lbl">expensive: full retrain pass</text>

  <rect x="440" y="170" width="180" height="70" rx="8" class="boxdash" />
  <text x="530" y="192" text-anchor="middle" class="txt">Spectral reparameterization</text>
  <text x="530" y="208" text-anchor="middle" class="lbl">transform trained weights</text>
  <text x="530" y="221" text-anchor="middle" class="lbl">(mechanism not in this excerpt)</text>
</svg>
