<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Framing announcement vs. concrete product</title>
  <desc id="desc">A vendor's framing announcement shapes the vocabulary of metrics, risks and timelines; a reader either mistakes it for fact or waits for concrete commitments like APIs and dates.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 14px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; opacity: 0.75; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrowhead); opacity: 0.85; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="20" y="120" width="180" height="60" rx="8" class="box"/>
  <text x="110" y="145" text-anchor="middle" class="txt">Программный анонс</text>
  <text x="110" y="163" text-anchor="middle" class="lbl">рамка, не продукт</text>

  <rect x="240" y="120" width="160" height="60" rx="8" class="box"/>
  <text x="320" y="145" text-anchor="middle" class="txt">Формирует язык</text>
  <text x="320" y="163" text-anchor="middle" class="lbl">метрики, риски, сроки</text>

  <rect x="440" y="30" width="180" height="60" rx="8" class="box"/>
  <text x="530" y="55" text-anchor="middle" class="txt">Принято как факт</text>
  <text x="530" y="75" text-anchor="middle" class="lbl">спутан с дорожной картой</text>

  <rect x="440" y="210" width="180" height="60" rx="8" class="box"/>
  <text x="530" y="235" text-anchor="middle" class="txt">Ждём конкретики</text>
  <text x="530" y="255" text-anchor="middle" class="lbl">API, сроки, обязательства</text>

  <path d="M200,150 L240,150" class="arrow"/>
  <path d="M400,140 C420,110 420,90 440,68" class="arrow"/>
  <path d="M400,160 C420,190 420,210 440,232" class="arrow"/>
</svg>
