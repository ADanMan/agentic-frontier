<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Multiplayer agent harness workspace</title>
  <desc id="desc">Two people and two agent sessions share one workspace, raising the question of who approves which action.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 14px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; opacity: 0.75; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrowhead); opacity: 0.85; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="140" height="50" rx="8" class="box"/>
  <text x="90" y="50" text-anchor="middle" class="txt">Человек A</text>

  <rect x="20" y="230" width="140" height="50" rx="8" class="box"/>
  <text x="90" y="260" text-anchor="middle" class="txt">Человек B</text>

  <rect x="480" y="20" width="140" height="50" rx="8" class="box"/>
  <text x="550" y="50" text-anchor="middle" class="txt">Агент-сессия 1</text>

  <rect x="480" y="230" width="140" height="50" rx="8" class="box"/>
  <text x="550" y="260" text-anchor="middle" class="txt">Агент-сессия 2</text>

  <circle cx="320" cy="150" r="60" class="box"/>
  <text x="320" y="145" text-anchor="middle" class="txt">Общее</text>
  <text x="320" y="163" text-anchor="middle" class="txt">рабочее</text>
  <text x="320" y="181" text-anchor="middle" class="lbl">пространство</text>

  <text x="320" y="260" text-anchor="middle" class="lbl">Кто одобряет какое действие?</text>

  <path d="M160,45 C220,80 260,110 280,120" class="arrow"/>
  <path d="M160,255 C220,220 260,190 280,180" class="arrow"/>
  <path d="M480,45 C420,80 380,110 360,120" class="arrow"/>
  <path d="M480,255 C420,220 380,190 360,180" class="arrow"/>
</svg>
