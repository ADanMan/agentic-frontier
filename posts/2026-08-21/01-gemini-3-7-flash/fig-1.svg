<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Model routing: fast vs flagship</title>
  <desc id="desc">A request goes to a router, which sends routine steps to a fast model like Gemini 3.7 Flash and hard steps to a flagship reasoning model, both feeding a single response.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 15px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; opacity: 0.75; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrowhead); opacity: 0.85; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="20" y="120" width="120" height="60" rx="8" class="box"/>
  <text x="80" y="155" text-anchor="middle" class="txt">Запрос</text>

  <rect x="200" y="120" width="120" height="60" rx="8" class="box"/>
  <text x="260" y="150" text-anchor="middle" class="txt">Роутер</text>

  <rect x="400" y="30" width="220" height="60" rx="8" class="box"/>
  <text x="510" y="55" text-anchor="middle" class="txt">Fast: Gemini 3.7 Flash</text>
  <text x="510" y="75" text-anchor="middle" class="lbl">рутинные шаги</text>

  <rect x="400" y="210" width="220" height="60" rx="8" class="box"/>
  <text x="510" y="235" text-anchor="middle" class="txt">Flagship reasoning</text>
  <text x="510" y="255" text-anchor="middle" class="lbl">сложные решения</text>

  <path d="M140,150 L200,150" class="arrow"/>
  <path d="M320,140 C360,110 370,80 400,62" class="arrow"/>
  <path d="M320,160 C360,190 370,220 400,238" class="arrow"/>
</svg>
