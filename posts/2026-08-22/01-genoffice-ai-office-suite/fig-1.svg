<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">genoffice: agent edit path</title>
  <desc id="desc">A user opens a document in genoffice; the built-in AI agent proposes an edit that goes through a preview/diff step; from there it either gets a human confirmation before writing to disk, or is auto-applied without review.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 14px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; opacity: 0.75; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrowhead); opacity: 0.85; }
    .dashed { stroke-dasharray: 5 4; opacity: 0.6; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="160" height="55" rx="8" class="box"/>
  <text x="100" y="52" text-anchor="middle" class="txt">.docx / .xlsx / .pptx</text>

  <rect x="240" y="20" width="160" height="55" rx="8" class="box"/>
  <text x="320" y="45" text-anchor="middle" class="txt">Built-in AI agent</text>
  <text x="320" y="63" text-anchor="middle" class="lbl">proposes edit</text>

  <rect x="240" y="120" width="160" height="55" rx="8" class="box"/>
  <text x="320" y="152" text-anchor="middle" class="txt">Preview / diff</text>

  <rect x="80" y="215" width="180" height="50" rx="8" class="box"/>
  <text x="170" y="240" text-anchor="middle" class="lbl">human confirms</text>
  <text x="170" y="256" text-anchor="middle" class="txt">Write to disk</text>

  <rect x="380" y="215" width="220" height="50" rx="8" class="box dashed"/>
  <text x="490" y="235" text-anchor="middle" class="lbl">auto-apply, no gate</text>
  <text x="490" y="251" text-anchor="middle" class="txt">Write to disk (unreviewed)</text>

  <path d="M180,47 L240,47" class="arrow"/>
  <path d="M320,75 L320,120" class="arrow"/>
  <path d="M270,175 L190,215" class="arrow"/>
  <path d="M370,175 L470,215" class="arrow dashed"/>
</svg>
