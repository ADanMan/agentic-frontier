<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">phone-harness: undifferentiated screen taps</title>
  <desc id="desc">An LLM decides an action, phone-harness executes a screen tap or swipe. The same tap mechanism reaches a harmless game app and a banking app with SMS codes, unless an explicit human confirmation gate is added before sensitive actions.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 14px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; opacity: 0.75; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrowhead); opacity: 0.85; }
    .dashed { stroke-dasharray: 5 4; opacity: 0.6; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="150" height="50" rx="8" class="box"/>
  <text x="95" y="50" text-anchor="middle" class="txt">LLM decides action</text>

  <rect x="245" y="20" width="150" height="50" rx="8" class="box"/>
  <text x="320" y="50" text-anchor="middle" class="txt">phone-harness</text>

  <rect x="470" y="20" width="150" height="50" rx="8" class="box"/>
  <text x="545" y="50" text-anchor="middle" class="txt">Screen tap / swipe</text>

  <rect x="380" y="130" width="130" height="50" rx="8" class="box"/>
  <text x="445" y="160" text-anchor="middle" class="lbl">Game / notes app</text>

  <rect x="380" y="220" width="230" height="60" rx="8" class="box dashed"/>
  <text x="495" y="245" text-anchor="middle" class="lbl">Banking app / SMS codes</text>
  <text x="495" y="263" text-anchor="middle" class="txt">real-world transfer</text>

  <path d="M170,45 L245,45" class="arrow"/>
  <path d="M395,45 L470,45" class="arrow"/>
  <path d="M545,70 L495,130" class="arrow"/>
  <path d="M545,70 L500,220" class="arrow dashed"/>

  <text x="495" y="200" text-anchor="middle" class="lbl">same tap mechanism, no built-in gate</text>
</svg>
