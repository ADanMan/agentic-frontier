<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .joint { fill: none; stroke: currentColor; stroke-width: 2.5; }
    .txt { fill: currentColor; font-size: 13px; }
    .lbl { fill: currentColor; font-size: 11px; opacity: 0.75; }
    .arrow { stroke: currentColor; stroke-width: 1.2; fill: none; marker-end: url(#arrow4); opacity: 0.85; }
    .dash { stroke: currentColor; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; opacity: 0.6; }
    svg { color: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e6e6e6; }
    }
  </style>
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="160" y="25" text-anchor="middle" class="txt" font-size="13" font-weight="bold">Сейчас: два прохода</text>

  <rect x="20" y="45" width="130" height="45" class="box" rx="6"/>
  <text x="85" y="72" text-anchor="middle" class="txt" font-size="11">Speech model</text>

  <rect x="190" y="45" width="130" height="45" class="box" rx="6"/>
  <text x="255" y="72" text-anchor="middle" class="txt" font-size="11">Motion model</text>

  <path d="M150,67 L188,67" class="dash"/>
  <text x="169" y="58" text-anchor="middle" class="lbl" font-size="10">нет общего<br/>контекста</text>

  <rect x="60" y="115" width="220" height="40" class="box" rx="6"/>
  <text x="170" y="140" text-anchor="middle" class="txt" font-size="11">Постпроцесс: синхронизация по таймкодам</text>

  <path d="M85,90 L140,115" class="arrow"/>
  <path d="M255,90 L200,115" class="arrow"/>

  <line x1="360" y1="20" x2="360" y2="280" class="dash"/>

  <text x="500" y="25" text-anchor="middle" class="txt" font-size="13" font-weight="bold">Заявка: joint-модель</text>

  <rect x="410" y="60" width="180" height="70" class="joint" rx="10"/>
  <text x="500" y="90" text-anchor="middle" class="txt" font-size="12">Motion-Omni</text>
  <text x="500" y="110" text-anchor="middle" class="lbl">end-to-end, один проход</text>

  <rect x="420" y="170" width="75" height="40" class="box" rx="6"/>
  <text x="457" y="195" text-anchor="middle" class="txt" font-size="11">Речь</text>

  <rect x="505" y="170" width="75" height="40" class="box" rx="6"/>
  <text x="542" y="195" text-anchor="middle" class="txt" font-size="11">Жест</text>

  <path d="M480,130 L457,170" class="arrow"/>
  <path d="M520,130 L542,170" class="arrow"/>

  <text x="500" y="260" text-anchor="middle" class="lbl">детали объединения потоков и метрики — в дайджесте обрезаны</text>
</svg>
