<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .rank1 { fill: none; stroke: currentColor; stroke-width: 2.5; }
    .txt { fill: currentColor; font-size: 13px; }
    .big { fill: currentColor; font-size: 15px; font-weight: bold; }
    .lbl { fill: currentColor; font-size: 12px; opacity: 0.75; }
    .arrow { stroke: currentColor; stroke-width: 1.2; fill: none; marker-end: url(#arrow3); opacity: 0.85; }
    svg { color: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e6e6e6; }
    }
  </style>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="280" height="120" class="rank1" rx="10"/>
  <text x="160" y="45" text-anchor="middle" class="big">Ranked #1 — ECC</text>
  <text x="160" y="75" text-anchor="middle" class="txt">251,265 → 251,634</text>
  <text x="160" y="93" text-anchor="middle" class="lbl">окно: +369</text>
  <text x="160" y="118" text-anchor="middle" class="txt">1,485 stars today</text>

  <rect x="340" y="20" width="280" height="120" class="box" rx="10"/>
  <text x="480" y="45" text-anchor="middle" class="big">Ranked #2 — mattpocock/skills</text>
  <text x="480" y="75" text-anchor="middle" class="txt">254,483 → 254,930</text>
  <text x="480" y="93" text-anchor="middle" class="lbl">окно: +447</text>
  <text x="480" y="118" text-anchor="middle" class="txt">2,207 stars today</text>

  <path d="M300,80 L340,80" class="arrow"/>
  <text x="320" y="70" text-anchor="middle" class="lbl" font-size="11">меньше</text>
  <text x="320" y="165" text-anchor="middle" class="lbl" font-size="11">по всем трём метрикам</text>

  <rect x="160" y="210" width="320" height="70" class="box" rx="10"/>
  <text x="320" y="240" text-anchor="middle" class="txt">Тогда что сортирует «Ranked #N»?</text>
  <text x="320" y="260" text-anchor="middle" class="lbl">не то, что показано на странице</text>

  <path d="M160,140 L280,210" class="arrow"/>
  <path d="M480,140 L400,210" class="arrow"/>

  <text x="320" y="310" text-anchor="middle" class="lbl">ранг ≠ видимые цифры — проверяйте сырые данные, а не позицию</text>
</svg>
