<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .highlight { fill: none; stroke: currentColor; stroke-width: 2.5; }
    .txt { fill: currentColor; font-size: 13px; }
    .lbl { fill: currentColor; font-size: 11px; opacity: 0.75; }
    .arrow { stroke: currentColor; stroke-width: 1.2; fill: none; marker-end: url(#arrow5); opacity: 0.85; }
    svg { color: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e6e6e6; }
    }
  </style>
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="230" y="15" width="180" height="40" class="box" rx="8"/>
  <text x="320" y="40" text-anchor="middle" class="txt">Агент рисует диаграмму</text>

  <rect x="40" y="100" width="220" height="60" class="box" rx="8"/>
  <text x="150" y="125" text-anchor="middle" class="txt">```mermaid``` блок</text>
  <text x="150" y="145" text-anchor="middle" class="lbl">быстро, автогенерируемо</text>

  <rect x="380" y="100" width="220" height="60" class="highlight" rx="8"/>
  <text x="490" y="125" text-anchor="middle" class="txt">diagram-design</text>
  <text x="490" y="145" text-anchor="middle" class="lbl">38 editorial-типов, HTML+SVG</text>

  <path d="M280,55 L150,100" class="arrow"/>
  <path d="M360,55 L490,100" class="arrow"/>

  <rect x="20" y="200" width="270" height="50" class="box" rx="8"/>
  <text x="155" y="222" text-anchor="middle" class="txt" font-size="12">"No Mermaid slop"</text>
  <text x="155" y="240" text-anchor="middle" class="lbl">претензия к дефолтному пути</text>

  <rect x="350" y="200" width="270" height="50" class="box" rx="8"/>
  <text x="485" y="222" text-anchor="middle" class="txt" font-size="12">Этот блог использует Mermaid</text>
  <text x="485" y="240" text-anchor="middle" class="lbl">в каждом посте, включая этот</text>

  <path d="M150,160 L155,200" class="arrow"/>
  <path d="M150,160 L485,200" class="arrow"/>

  <text x="320" y="285" text-anchor="middle" class="lbl">черновик идеи vs финальный дизайн-артефакт — разные задачи</text>
</svg>
