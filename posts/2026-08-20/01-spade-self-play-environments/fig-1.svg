<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a94a6"/>
    </marker>
    <marker id="arwB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b8def"/>
    </marker>
  </defs>

  <!-- Frozen pool (left) -->
  <text x="150" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#8a94a6">Frozen pool → plateau</text>
  <rect x="55" y="60" width="190" height="70" rx="10" fill="none" stroke="#8a94a6" stroke-width="1.6"/>
  <text x="150" y="90" text-anchor="middle" font-size="13" fill="#8a94a6">Fixed task set</text>
  <text x="150" y="110" text-anchor="middle" font-size="12" fill="#8a94a6">(hand-curated · static ·</text>
  <text x="150" y="126" text-anchor="middle" font-size="12" fill="#8a94a6">frozen verifier)</text>
  <path d="M60 300 C110 300 150 240 175 190 C200 150 215 148 230 146" fill="none" stroke="#8a94a6" stroke-width="2.2" stroke-dasharray="6 5"/>
  <text x="150" y="330" text-anchor="middle" font-size="12" fill="#8a94a6">skill rises, then flattens</text>

  <!-- SPADE co-evolving loop (right) -->
  <text x="510" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#5b8def">SPADE: co-evolving loop</text>

  <rect x="400" y="70" width="220" height="60" rx="12" fill="none" stroke="#5b8def" stroke-width="2"/>
  <text x="510" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#5b8def">Language agent</text>
  <text x="510" y="116" text-anchor="middle" font-size="12" fill="#8a94a6">solves current goals</text>

  <rect x="400" y="270" width="220" height="60" rx="12" fill="none" stroke="#5b8def" stroke-width="2"/>
  <text x="510" y="296" text-anchor="middle" font-size="14" font-weight="600" fill="#5b8def">Environment generator</text>
  <text x="510" y="316" text-anchor="middle" font-size="12" fill="#8a94a6">synthesizes new goals</text>

  <rect x="330" y="170" width="150" height="60" rx="12" fill="none" stroke="#8a94a6" stroke-width="1.6"/>
  <text x="405" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#8a94a6">Executable</text>
  <text x="405" y="214" text-anchor="middle" font-size="12" fill="#8a94a6">check (run it)</text>

  <rect x="540" y="170" width="150" height="60" rx="12" fill="none" stroke="#8a94a6" stroke-width="1.6"/>
  <text x="615" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#8a94a6">Training</text>
  <text x="615" y="214" text-anchor="middle" font-size="12" fill="#8a94a6">signal</text>

  <!-- loop arrows -->
  <path d="M470 130 C450 150 430 158 425 168" fill="none" stroke="#5b8def" stroke-width="2" marker-end="url(#arwB)"/>
  <path d="M420 230 C430 245 450 258 470 270" fill="none" stroke="#5b8def" stroke-width="2" marker-end="url(#arwB)"/>
  <path d="M550 270 C570 258 590 245 600 230" fill="none" stroke="#8a94a6" stroke-width="2" marker-end="url(#arw)"/>
  <path d="M600 168 C590 158 570 150 550 130" fill="none" stroke="#8a94a6" stroke-width="2" marker-end="url(#arw)"/>

  <text x="510" y="380" text-anchor="middle" font-size="12" fill="#8a94a6">goals grow with the learner — the distribution never freezes</text>
</svg>
