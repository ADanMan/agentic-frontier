<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Where the technical boundary actually sits</title>
  <desc id="desc">MCP connectors give agents real read access to FactSet, Moody's, PitchBook and other live data. The output side, turning a model draft into a firm decision, is guarded only by a text disclaimer and human review practice, not a technical gate.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .dash { stroke: currentColor; stroke-width: 2; fill: none; stroke-dasharray: 5 5; marker-end: url(#arrow); }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="20" y="20" width="180" height="55" rx="8" class="boxfill" />
  <text x="110" y="42" text-anchor="middle" class="txt">Input side</text>
  <text x="110" y="60" text-anchor="middle" class="lbl">MCP: FactSet, Moody's,</text>
  <text x="110" y="73" text-anchor="middle" class="lbl">PitchBook — real read access</text>

  <path d="M200,47 L280,47" class="arrow" />

  <rect x="280" y="20" width="180" height="55" rx="8" class="box" />
  <text x="370" y="42" text-anchor="middle" class="txt">Agent</text>
  <text x="370" y="60" text-anchor="middle" class="lbl">drafts model, memo,</text>
  <text x="370" y="73" text-anchor="middle" class="lbl">reconciliation, KYC note</text>

  <path d="M370,75 L370,120" class="arrow" />

  <rect x="260" y="120" width="220" height="55" rx="8" class="boxfill" />
  <text x="370" y="142" text-anchor="middle" class="txt">Output side</text>
  <text x="370" y="160" text-anchor="middle" class="lbl">no technical gate —</text>
  <text x="370" y="173" text-anchor="middle" class="lbl">just a disclaimer + practice</text>

  <path d="M370,175 L370,210" class="dash" />

  <rect x="240" y="210" width="260" height="40" rx="8" class="box" />
  <text x="370" y="235" text-anchor="middle" class="txt">"for review by a qualified professional"</text>

  <text x="320" y="20" text-anchor="middle" class="lbl" style="display:none"></text>
</svg>
