<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="title desc">
  <title id="title">Claimed numbers vs. what backs them</title>
  <desc id="desc">Agent Substrate claims 30x+ oversubscription and 500+ suspend/resume activations per second, sub-500ms resume. These figures come from the project's own README with no visible benchmark methodology, and the project itself warns its APIs are almost guaranteed to change.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>

  <rect x="20" y="30" width="270" height="90" rx="8" class="boxfill" />
  <text x="155" y="55" text-anchor="middle" class="txt">Claimed in README</text>
  <text x="155" y="75" text-anchor="middle" class="lbl">"30x+ oversubscription"</text>
  <text x="155" y="92" text-anchor="middle" class="lbl">"500+ activations/sec,</text>
  <text x="155" y="107" text-anchor="middle" class="lbl">sub-500ms resume"</text>

  <rect x="350" y="30" width="270" height="90" rx="8" class="box" />
  <text x="485" y="55" text-anchor="middle" class="txt">Not shown</text>
  <text x="485" y="75" text-anchor="middle" class="lbl">benchmark methodology</text>
  <text x="485" y="92" text-anchor="middle" class="lbl">hardware / workload spec</text>
  <text x="485" y="107" text-anchor="middle" class="lbl">reproducible test</text>

  <rect x="120" y="150" width="400" height="50" rx="8" class="boxfill" />
  <text x="320" y="180" text-anchor="middle" class="txt">Project's own caveat: "APIs almost guaranteed to change"</text>
</svg>
