<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="title desc">
  <title id="title">Customer onboarding time, before vs after automation</title>
  <desc id="desc">A bar comparison showing manual customer onboarding taking a long bar of time, versus a shortened bar after introducing an LLM-assisted workflow, with a claimed 68 percent reduction.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .bar { fill: currentColor; opacity: 0.25; }
    .bar2 { fill: currentColor; opacity: 0.75; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 14px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; opacity: 0.75; }
  </style>

  <text x="20" y="30" class="txt">Онбординг клиента / Customer onboarding</text>

  <text x="20" y="75" class="lbl">До / Before</text>
  <rect x="120" y="55" width="480" height="30" class="bar"/>
  <text x="610" y="75" class="lbl" text-anchor="end">100%</text>

  <text x="20" y="140" class="lbl">После / After (ChatGPT Work, заявлено)</text>
  <rect x="120" y="120" width="154" height="30" class="bar2"/>
  <text x="290" y="140" class="lbl">-68%</text>

  <line x1="120" y1="180" x2="120" y2="200" class="box"/>
  <line x1="600" y1="180" x2="600" y2="200" class="box"/>
  <line x1="120" y1="190" x2="600" y2="190" class="box"/>
  <text x="360" y="215" text-anchor="middle" class="lbl">вендорская метрика — не аудированное число / vendor metric, not audited</text>
</svg>
