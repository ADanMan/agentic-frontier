<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-labelledby="title desc">
  <title id="title">Fuxi routing requests across LLM providers by cost</title>
  <desc id="desc">A developer in a terminal talks to Fuxi, which sends a routine step to a cheap provider and a hard step to an expensive provider, based on cost-aware routing.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 13px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.75; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrowhead); opacity: 0.85; }
    .dashed { stroke-dasharray: 5 4; opacity: 0.6; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="15" y="95" width="110" height="50" rx="8" class="box"/>
  <text x="70" y="120" text-anchor="middle" class="txt">Terminal</text>
  <text x="70" y="135" text-anchor="middle" class="lbl">developer</text>

  <rect x="180" y="95" width="100" height="50" rx="8" class="box"/>
  <text x="230" y="125" text-anchor="middle" class="txt">Fuxi</text>

  <rect x="360" y="30" width="140" height="50" rx="8" class="box"/>
  <text x="430" y="55" text-anchor="middle" class="txt">Cheap provider</text>
  <text x="430" y="70" text-anchor="middle" class="lbl">routine step</text>

  <rect x="360" y="160" width="140" height="50" rx="8" class="box"/>
  <text x="430" y="185" text-anchor="middle" class="txt">Costly provider</text>
  <text x="430" y="200" text-anchor="middle" class="lbl">hard step</text>

  <path d="M125,120 L180,120" class="arrow"/>
  <path d="M280,110 L360,65" class="arrow"/>
  <path d="M280,130 L360,180" class="arrow dashed"/>
</svg>
