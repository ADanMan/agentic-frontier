<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
  <title id="title">Configuration and monitoring around the authorization boundary</title>
  <desc id="desc">claude-code-templates configures permissions and hooks (what the agent may do) and monitors execution (what it actually did), both sitting on either side of the propose-versus-execute boundary.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>

  <rect x="20" y="30" width="260" height="80" rx="8" class="boxfill" />
  <text x="150" y="60" text-anchor="middle" class="txt">Configuration</text>
  <text x="150" y="80" text-anchor="middle" class="lbl">permissions, hooks,</text>
  <text x="150" y="96" text-anchor="middle" class="lbl">skill templates</text>

  <rect x="360" y="30" width="260" height="80" rx="8" class="boxfill" />
  <text x="490" y="60" text-anchor="middle" class="txt">Monitoring</text>
  <text x="490" y="80" text-anchor="middle" class="lbl">what the agent</text>
  <text x="490" y="96" text-anchor="middle" class="lbl">actually did</text>

  <line x1="150" y1="110" x2="150" y2="150" class="box" />
  <line x1="490" y1="110" x2="490" y2="150" class="box" />
  <line x1="150" y1="150" x2="490" y2="150" class="box" />

  <rect x="200" y="165" width="240" height="55" rx="8" class="box" />
  <text x="320" y="188" text-anchor="middle" class="txt">The authorization boundary</text>
  <text x="320" y="206" text-anchor="middle" class="lbl">"proposed" vs "executed"</text>
</svg>
