<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
  <title id="title">What backs the claim "works"?</title>
  <desc id="desc">obra/superpowers claims its methodology "works". Stars and forks measure recognition of the claim, not verification of the outcome, which the digest does not provide.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 13px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; opacity: 0.7; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="20" y="20" width="220" height="50" rx="8" class="box" />
  <text x="130" y="42" text-anchor="middle" class="txt">obra/superpowers</text>
  <text x="130" y="60" text-anchor="middle" class="lbl">283,972 → 284,164 ★</text>

  <path d="M240,45 H300" class="arrow" />
  <rect x="300" y="20" width="200" height="50" rx="8" class="box" />
  <text x="400" y="42" text-anchor="middle" class="txt">README claims:</text>
  <text x="400" y="60" text-anchor="middle" class="txt">"works"</text>

  <path d="M400,70 V100" class="arrow" />
  <rect x="300" y="100" width="200" height="40" rx="8" class="box" />
  <text x="400" y="125" text-anchor="middle" class="txt">What backs "works"?</text>

  <path d="M400,140 L200,180" class="arrow" />
  <path d="M400,140 L500,180" class="arrow" />

  <rect x="80" y="180" width="240" height="46" rx="8" class="boxfill" />
  <text x="200" y="200" text-anchor="middle" class="txt">Stars / forks</text>
  <text x="200" y="216" text-anchor="middle" class="lbl">recognition, not result</text>

  <rect x="400" y="180" width="220" height="46" rx="8" class="box" />
  <text x="510" y="200" text-anchor="middle" class="txt">Reproduced case</text>
  <text x="510" y="216" text-anchor="middle" class="lbl">absent from digest</text>
</svg>
