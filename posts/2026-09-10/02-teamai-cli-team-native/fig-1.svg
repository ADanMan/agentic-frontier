<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">"Make Every Team AI Native" names a state, not a mechanism</title>
  <desc id="desc">The tagline could mean a shared CLI, shared memory across tasks, or shared permissions. The README does not specify which, so a reader has to check the code.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 13px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .dash { stroke: currentColor; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; marker-end: url(#arrow); opacity: 0.6; }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="220" y="16" width="200" height="50" rx="8" class="box" />
  <text x="320" y="38" text-anchor="middle" class="txt">"Make Every Team</text>
  <text x="320" y="56" text-anchor="middle" class="txt">AI Native"</text>

  <path d="M320,66 V96" class="arrow" />
  <rect x="240" y="96" width="160" height="34" rx="8" class="box" />
  <text x="320" y="118" text-anchor="middle" class="txt">How, exactly?</text>

  <path d="M280,130 L100,170" class="arrow" />
  <path d="M320,130 V170" class="arrow" />
  <path d="M360,130 L540,170" class="arrow" />

  <rect x="20" y="170" width="160" height="40" rx="8" class="boxfill" />
  <text x="100" y="195" text-anchor="middle" class="txt">Shared CLI</text>

  <rect x="240" y="170" width="160" height="40" rx="8" class="boxfill" />
  <text x="320" y="195" text-anchor="middle" class="txt">Shared memory</text>

  <rect x="460" y="170" width="160" height="40" rx="8" class="boxfill" />
  <text x="540" y="195" text-anchor="middle" class="txt">Shared permissions</text>

  <path d="M100,210 V235" class="dash" />
  <path d="M320,210 V235" class="dash" />
  <path d="M540,210 V235" class="dash" />
  <text x="320" y="250" text-anchor="middle" class="lbl">README doesn't say which — reader has to check the code</text>
</svg>
