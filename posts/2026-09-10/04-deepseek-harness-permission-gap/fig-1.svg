<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
  <title id="title">Fork-to-star ratio holds flat while stars climb</title>
  <desc id="desc">deepseek-harness stars grew from 209k on Sept 3 to 216.8k on Sept 10, but the fork-to-star ratio stayed at about 11.8 percent across the last two readings.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 13px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .axis { stroke: currentColor; stroke-width: 1; opacity: 0.4; }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <line x1="60" y1="190" x2="600" y2="190" class="axis" />
  <line x1="60" y1="30" x2="60" y2="190" class="axis" />

  <circle cx="120" cy="150" r="4" fill="currentColor" />
  <text x="120" y="205" text-anchor="middle" class="lbl">Sep 3</text>
  <text x="120" y="140" text-anchor="middle" class="txt">209k★</text>

  <circle cx="260" cy="120" r="4" fill="currentColor" />
  <text x="260" y="205" text-anchor="middle" class="lbl">Sep 5</text>
  <text x="260" y="110" text-anchor="middle" class="txt">211k★</text>

  <circle cx="420" cy="80" r="4" fill="currentColor" />
  <text x="420" y="205" text-anchor="middle" class="lbl">Sep 9</text>
  <text x="420" y="70" text-anchor="middle" class="txt">215.6k★</text>
  <text x="420" y="55" text-anchor="middle" class="lbl">forks/stars 11.8%</text>

  <circle cx="560" cy="55" r="4" fill="currentColor" />
  <text x="560" y="205" text-anchor="middle" class="lbl">Sep 10</text>
  <text x="560" y="42" text-anchor="middle" class="txt">216.8k★</text>
  <text x="560" y="27" text-anchor="middle" class="lbl">forks/stars 11.8%</text>

  <path d="M120,150 L260,120 L420,80 L560,55" class="arrow" fill="none" stroke="currentColor" stroke-width="2" />
</svg>
