<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
  <title id="title">From per-head KV cache to grouped values with on-demand keys</title>
  <desc id="desc">Standard attention stores a key and value per head. Grouped-query attention shares key and value across a group of heads. Grouped Value Attention, per its title, keeps only grouped values cached and reconstructs keys on demand.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="10" y="20" width="180" height="70" rx="8" class="boxfill" />
  <text x="100" y="45" text-anchor="middle" class="txt">Standard cache</text>
  <text x="100" y="63" text-anchor="middle" class="lbl">K + V per head</text>
  <text x="100" y="78" text-anchor="middle" class="lbl">most memory</text>

  <path d="M190,55 L245,55" class="arrow" />

  <rect x="245" y="20" width="180" height="70" rx="8" class="boxfill" />
  <text x="335" y="45" text-anchor="middle" class="txt">GQA</text>
  <text x="335" y="63" text-anchor="middle" class="lbl">K + V shared per group</text>
  <text x="335" y="78" text-anchor="middle" class="lbl">still stores both</text>

  <path d="M425,55 L480,55" class="arrow" />

  <rect x="480" y="20" width="150" height="70" rx="8" class="box" />
  <text x="555" y="42" text-anchor="middle" class="txt" font-size="11">Grouped Value</text>
  <text x="555" y="58" text-anchor="middle" class="txt" font-size="11">Attention (title)</text>
  <text x="555" y="74" text-anchor="middle" class="lbl">V cached, K rebuilt</text>

  <path d="M555,90 L555,140" class="arrow" />
  <text x="555" y="158" text-anchor="middle" class="lbl">on-demand key</text>
  <text x="555" y="172" text-anchor="middle" class="lbl">reconstruction</text>

  <text x="320" y="215" text-anchor="middle" class="lbl">Cache footprint decreases left to right — per paper title only, mechanism unverified</text>
</svg>
