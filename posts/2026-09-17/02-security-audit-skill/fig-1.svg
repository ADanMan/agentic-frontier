<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Multi-phase security audit, and two conflicting growth numbers</title>
  <desc id="desc">A codebase goes through a findings phase and a verification phase to produce machine-readable results. Separately, the same trending card reports two different growth numbers for the same day: a plus-310 window gain and a 927 stars today figure.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .dash { stroke: currentColor; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; opacity: 0.6; }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="10" y="30" width="120" height="60" rx="8" class="boxfill" />
  <text x="70" y="55" text-anchor="middle" class="txt">Codebase</text>
  <text x="70" y="72" text-anchor="middle" class="lbl">scan target</text>

  <path d="M130,60 L195,60" class="arrow" />

  <rect x="195" y="30" width="120" height="60" rx="8" class="boxfill" />
  <text x="255" y="55" text-anchor="middle" class="txt">Phase 1</text>
  <text x="255" y="72" text-anchor="middle" class="lbl">find issues</text>

  <path d="M315,60 L380,60" class="arrow" />

  <rect x="380" y="30" width="130" height="60" rx="8" class="boxfill" />
  <text x="445" y="50" text-anchor="middle" class="txt">Phase 2</text>
  <text x="445" y="67" text-anchor="middle" class="lbl">verify — same or</text>
  <text x="445" y="80" text-anchor="middle" class="lbl">different model?</text>

  <path d="M510,60 L575,60" class="arrow" />

  <rect x="575" y="35" width="55" height="50" rx="8" class="boxfill" />
  <text x="602" y="55" text-anchor="middle" class="txt" font-size="10">Report</text>

  <line x1="20" y1="160" x2="620" y2="160" class="dash" />
  <text x="320" y="150" text-anchor="middle" class="lbl">same trending card, same day</text>

  <rect x="70" y="175" width="200" height="55" rx="8" class="box" />
  <text x="170" y="198" text-anchor="middle" class="txt">Window gain</text>
  <text x="170" y="216" text-anchor="middle" class="txt" font-size="14">+310</text>

  <rect x="370" y="175" width="200" height="55" rx="8" class="box" />
  <text x="470" y="198" text-anchor="middle" class="txt">"Stars today"</text>
  <text x="470" y="216" text-anchor="middle" class="txt" font-size="14">927</text>

  <text x="320" y="250" text-anchor="middle" class="lbl">~3x apart — different measurement windows</text>
</svg>
