<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="A textbook about agents in general, filed under a narrower RAG category">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: none; stroke: #6b7280; stroke-width: 1.5; }
    .tag { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .content { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .title { font: 600 15px sans-serif; fill: #111827; }
    .label { font: 13px sans-serif; fill: #374151; }
    .small { font: 12px sans-serif; fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111827; }
      .box { stroke: #9ca3af; }
      .tag { fill: #4c1d1d; stroke: #f87171; }
      .content { fill: #052e21; stroke: #34d399; }
      .title { fill: #f3f4f6; }
      .label { fill: #d1d5db; }
      .small { fill: #9ca3af; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="640" height="300"/>

  <rect class="box" x="150" y="20" width="340" height="60" rx="8"/>
  <text class="title" x="170" y="45">datawhalechina / hello-agents</text>
  <text class="small" x="170" y="65">80,794★ / 10,048 forks — Python</text>

  <rect class="tag" x="60" y="140" width="220" height="70" rx="8"/>
  <text class="label" x="80" y="170">Digest category:</text>
  <text class="title" x="80" y="195">"RAG"</text>

  <rect class="content" x="360" y="140" width="220" height="70" rx="8"/>
  <text class="label" x="380" y="165">Actual title:</text>
  <text class="small" x="380" y="185">agent principles &amp;</text>
  <text class="small" x="380" y="200">practice, general</text>

  <path d="M280,175 L360,175" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="small" x="285" y="165">mismatch</text>
</svg>
