<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="Six compression techniques in one library, feeding vendor-benchmarked deployment claims">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: none; stroke: #6b7280; stroke-width: 1.5; }
    .hub { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .tech { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.2; }
    .title { font: 600 15px sans-serif; fill: #111827; }
    .label { font: 12px sans-serif; fill: #374151; }
    .small { font: 11px sans-serif; fill: #6b7280; }
    .arrow { stroke: #6b7280; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111827; }
      .box { stroke: #9ca3af; }
      .hub { fill: #1e3a5f; stroke: #60a5fa; }
      .tech { fill: #1f2937; stroke: #9ca3af; }
      .title { fill: #f3f4f6; }
      .label { fill: #d1d5db; }
      .small { fill: #9ca3af; }
      .arrow { stroke: #9ca3af; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="640" height="440"/>

  <rect class="hub" x="20" y="150" width="130" height="60" rx="8"/>
  <text class="title" x="35" y="175">Model-</text>
  <text class="title" x="35" y="193">Optimizer</text>

  <path class="arrow" d="M150,158 L235,42"/>
  <path class="arrow" d="M150,168 L235,100"/>
  <path class="arrow" d="M150,180 L235,160"/>
  <path class="arrow" d="M150,192 L235,220"/>
  <path class="arrow" d="M150,202 L235,280"/>

  <rect class="tech" x="235" y="20" width="150" height="40" rx="6"/>
  <text class="label" x="248" y="45">PTQ / QAT</text>

  <rect class="tech" x="235" y="80" width="150" height="40" rx="6"/>
  <text class="label" x="248" y="105">Pruning</text>

  <rect class="tech" x="235" y="140" width="150" height="40" rx="6"/>
  <text class="label" x="248" y="165">Distillation</text>

  <rect class="tech" x="235" y="200" width="150" height="40" rx="6"/>
  <text class="label" x="248" y="225">Speculative decoding</text>

  <rect class="tech" x="235" y="260" width="150" height="40" rx="6"/>
  <text class="label" x="248" y="285">Sparsity</text>

  <path class="arrow" d="M385,40 L440,165"/>
  <path class="arrow" d="M385,100 L440,172"/>
  <path class="arrow" d="M385,160 L440,180"/>
  <path class="arrow" d="M385,220 L440,188"/>
  <path class="arrow" d="M385,280 L440,195"/>

  <rect class="box" x="440" y="150" width="180" height="60" rx="8"/>
  <text class="label" x="455" y="175">TensorRT-LLM / vLLM /</text>
  <text class="label" x="455" y="193">SGLang / TensorRT</text>

  <rect class="box" x="20" y="340" width="600" height="80" rx="8"/>
  <text class="small" x="35" y="362">Vendor-run claims from the README (own hardware, own scenarios):</text>
  <text class="small" x="35" y="382">Nemotron: up to 5.9x throughput · DeepSeek-R1: FP4 optimized · Adobe diffusion: -60% latency</text>
  <text class="small" x="35" y="402">Stars: 4,734 → 4,801 (+67), ranked #3 trending — no independent benchmark included.</text>
</svg>
