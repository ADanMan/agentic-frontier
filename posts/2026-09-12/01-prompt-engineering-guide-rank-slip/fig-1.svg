<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Two RAG-category repos swap trending ranks on the same day</title>
  <desc id="desc">Prompt-Engineering-Guide falls from rank 9 to 10 while hello-agents rises from rank 10 to 9, in the same category, same day.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .big { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 15px; font-weight: 600; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="20" y="20" width="270" height="80" rx="8" class="boxfill" />
  <text x="155" y="42" text-anchor="middle" class="txt">Prompt-Engineering-Guide</text>
  <text x="155" y="65" text-anchor="middle" class="big">#9 → #10 (down)</text>
  <text x="155" y="85" text-anchor="middle" class="lbl">78,197★ · 8,585 forks</text>

  <rect x="20" y="160" width="270" height="80" rx="8" class="boxfill" />
  <text x="155" y="182" text-anchor="middle" class="txt">hello-agents</text>
  <text x="155" y="205" text-anchor="middle" class="big">#10 → #9 (up)</text>
  <text x="155" y="225" text-anchor="middle" class="lbl">78,362★ · 9,731 forks</text>

  <path d="M290,60 L420,120" class="arrow" />
  <path d="M290,200 L420,140" class="arrow" />

  <rect x="420" y="100" width="200" height="60" rx="8" class="box" />
  <text x="520" y="125" text-anchor="middle" class="txt">Same category,</text>
  <text x="520" y="143" text-anchor="middle" class="txt">same day, swapped</text>

  <text x="520" y="185" text-anchor="middle" class="lbl">one slot of noise,</text>
  <text x="520" y="202" text-anchor="middle" class="lbl">not a verdict on a genre</text>
</svg>
