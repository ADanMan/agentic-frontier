<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Near-tied stars, wider fork gap between two RAG-category repos</title>
  <desc id="desc">hello-agents and Prompt-Engineering-Guide sit within 0.2% on stars, but hello-agents carries 1,146 more forks.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .big { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 15px; font-weight: 600; }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>

  <text x="320" y="24" text-anchor="middle" class="txt">Stars (almost tied)</text>
  <rect x="60" y="36" width="220" height="26" rx="4" class="boxfill" />
  <text x="70" y="54" class="lbl">Prompt-Engineering-Guide</text>
  <rect x="360" y="36" width="220" height="26" rx="4" class="boxfill" />
  <text x="370" y="54" class="lbl">hello-agents</text>
  <text x="170" y="80" text-anchor="middle" class="big">78,197★</text>
  <text x="470" y="80" text-anchor="middle" class="big">78,362★</text>
  <text x="320" y="80" text-anchor="middle" class="lbl">≈ 0.2% apart</text>

  <text x="320" y="130" text-anchor="middle" class="txt">Forks (wider gap)</text>
  <rect x="90" y="150" width="140" height="70" rx="6" class="box" />
  <text x="160" y="190" text-anchor="middle" class="big">8,585</text>
  <rect x="380" y="150" width="180" height="70" rx="6" class="box" />
  <text x="470" y="190" text-anchor="middle" class="big">9,731</text>

  <text x="320" y="245" text-anchor="middle" class="lbl">+1,146 forks — someone is actually running the code</text>
</svg>
