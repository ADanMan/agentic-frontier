<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Stars vs. forks as signals</title>
  <desc id="desc">ECC's star count grew from 252,006 to 253,321, a gain of 1,315. Its fork count sits at 37,991. A star costs a click after reading a README; a fork costs an intent to do something with the code.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 13px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; opacity: 0.7; }
    .big { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 20px; font-weight: 700; }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>

  <rect x="20" y="20" width="280" height="90" rx="8" class="boxfill" />
  <text x="160" y="50" text-anchor="middle" class="big">253,321 ★</text>
  <text x="160" y="72" text-anchor="middle" class="lbl">+1,315 за окно</text>
  <text x="160" y="92" text-anchor="middle" class="lbl">= клик после чтения README</text>

  <rect x="340" y="20" width="280" height="90" rx="8" class="box" />
  <text x="480" y="50" text-anchor="middle" class="big">37,991 форков</text>
  <text x="480" y="72" text-anchor="middle" class="lbl">требует намерения</text>
  <text x="480" y="92" text-anchor="middle" class="lbl">что-то сделать с кодом</text>

  <line x1="20" y1="140" x2="620" y2="140" stroke="currentColor" stroke-width="1" opacity="0.2" />

  <text x="20" y="170" class="txt">Что звёзды НЕ доказывают:</text>
  <text x="20" y="195" class="lbl">— что «security» для 5 харнессов проверена независимым аудитом</text>
  <text x="20" y="215" class="lbl">— что «performance optimization» подтверждена бенчмарком</text>
  <text x="20" y="235" class="lbl">— что заявленные фичи вообще протестированы за пределами README</text>
</svg>
