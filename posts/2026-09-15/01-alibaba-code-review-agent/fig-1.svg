<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid code review pipeline</title>
  <desc id="desc">A pull request is checked by both a deterministic rule layer for known bug classes and an LLM agent for contextual judgment; both feed into line-level PR comments.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .big { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 14px; font-weight: 600; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="20" y="100" width="130" height="60" rx="8" class="boxfill" />
  <text x="85" y="126" text-anchor="middle" class="txt">Pull request</text>
  <text x="85" y="144" text-anchor="middle" class="big">new code</text>

  <path d="M150,120 L230,60" class="arrow" />
  <path d="M150,140 L230,180" class="arrow" />

  <rect x="230" y="30" width="180" height="60" rx="8" class="boxfill" />
  <text x="320" y="55" text-anchor="middle" class="txt">Deterministic layer</text>
  <text x="320" y="73" text-anchor="middle" class="lbl">NPE, XSS, SQL injection</text>

  <rect x="230" y="150" width="180" height="60" rx="8" class="boxfill" />
  <text x="320" y="175" text-anchor="middle" class="txt">LLM agent</text>
  <text x="320" y="193" text-anchor="middle" class="lbl">meaning &amp; context</text>

  <path d="M410,60 L490,110" class="arrow" />
  <path d="M410,180 L490,130" class="arrow" />

  <rect x="490" y="95" width="130" height="55" rx="8" class="box" />
  <text x="555" y="117" text-anchor="middle" class="txt">Line-level</text>
  <text x="555" y="135" text-anchor="middle" class="txt">PR comments</text>

  <text x="320" y="235" text-anchor="middle" class="lbl">known bug classes get certainty, the rest gets judgment</text>
</svg>
