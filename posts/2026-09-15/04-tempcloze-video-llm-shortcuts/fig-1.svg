<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Three shortcut routes in video-LLM benchmarks</title>
  <desc id="desc">A video question with text answer options can be guessed correctly through option wording, answer correlations, or language priors, without watching the video.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="20" y="100" width="150" height="60" rx="8" class="boxfill" />
  <text x="95" y="126" text-anchor="middle" class="txt">Video + multiple-</text>
  <text x="95" y="144" text-anchor="middle" class="txt">choice question</text>

  <path d="M170,115 L260,45" class="arrow" />
  <path d="M170,130 L260,130" class="arrow" />
  <path d="M170,145 L260,215" class="arrow" />

  <rect x="260" y="20" width="180" height="50" rx="8" class="boxfill" />
  <text x="350" y="50" text-anchor="middle" class="lbl">option wording hints</text>

  <rect x="260" y="105" width="180" height="50" rx="8" class="boxfill" />
  <text x="350" y="135" text-anchor="middle" class="lbl">answer correlations</text>

  <rect x="260" y="190" width="180" height="50" rx="8" class="boxfill" />
  <text x="350" y="220" text-anchor="middle" class="lbl">language priors</text>

  <path d="M440,45 L510,120" class="arrow" />
  <path d="M440,130 L510,130" class="arrow" />
  <path d="M440,215 L510,140" class="arrow" />

  <rect x="510" y="100" width="115" height="60" rx="8" class="box" />
  <text x="567" y="126" text-anchor="middle" class="txt">Correct guess,</text>
  <text x="567" y="144" text-anchor="middle" class="txt">video unwatched</text>
</svg>
