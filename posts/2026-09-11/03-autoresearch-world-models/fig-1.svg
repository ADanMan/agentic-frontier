<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">World model as a cheap stand-in for real experiments</title>
  <desc id="desc">A research agent can run a real, slow, expensive experiment, or query a world model for a fast, cheap predicted outcome, with accuracy on novel hypotheses left unverified by the abstract.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .boxfade { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-dasharray: 5 5; opacity: 0.6; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 13px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="20" y="108" width="140" height="44" rx="8" class="box" />
  <text x="90" y="135" text-anchor="middle" class="txt">Hypothesis</text>

  <path d="M160,120 L230,50" class="arrow" />
  <path d="M160,140 L230,190" class="arrow" />

  <rect x="230" y="20" width="190" height="56" rx="8" class="boxfade" />
  <text x="325" y="44" text-anchor="middle" class="txt">Real experiment</text>
  <text x="325" y="62" text-anchor="middle" class="lbl">slow, expensive, per iteration</text>

  <rect x="230" y="164" width="190" height="56" rx="8" class="boxfill" />
  <text x="325" y="188" text-anchor="middle" class="txt">World-model query</text>
  <text x="325" y="206" text-anchor="middle" class="lbl">fast, cheap, predicted outcome</text>

  <path d="M420,192 H480" class="arrow" />
  <rect x="480" y="164" width="140" height="56" rx="8" class="box" />
  <text x="550" y="188" text-anchor="middle" class="txt">Accurate on</text>
  <text x="550" y="206" text-anchor="middle" class="lbl">novel hypotheses? unverified</text>
</svg>
