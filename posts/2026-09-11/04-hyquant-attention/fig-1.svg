<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Attention tolerates quantization worse than MLP layers</title>
  <desc id="desc">The same low bit-width causes acceptable error in MLP weights but large error in the attention module, motivating a hybrid-precision split.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .boxwarn { fill: currentColor; opacity: 0.16; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 13px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="20" y="20" width="150" height="44" rx="8" class="box" />
  <text x="95" y="47" text-anchor="middle" class="txt">Full model</text>

  <path d="M170,32 H240" class="arrow" />
  <path d="M170,52 H240" class="arrow" />

  <rect x="240" y="10" width="170" height="50" rx="8" class="boxfill" />
  <text x="325" y="30" text-anchor="middle" class="txt">MLP / weight layers</text>
  <text x="325" y="48" text-anchor="middle" class="lbl">low bit-width → OK</text>

  <rect x="240" y="80" width="170" height="50" rx="8" class="boxwarn" />
  <text x="325" y="100" text-anchor="middle" class="txt">Attention module</text>
  <text x="325" y="118" text-anchor="middle" class="lbl">low bit-width → large error</text>

  <path d="M410,105 H470" class="arrow" />
  <rect x="470" y="70" width="150" height="70" rx="8" class="box" />
  <text x="545" y="95" text-anchor="middle" class="txt">HyQuant:</text>
  <text x="545" y="113" text-anchor="middle" class="txt">hybrid precision</text>
  <text x="545" y="130" text-anchor="middle" class="lbl">within attention</text>

  <text x="325" y="185" text-anchor="middle" class="lbl">softmax weighting is more precision-sensitive</text>
  <text x="325" y="202" text-anchor="middle" class="lbl">than a linear transform averaged over many dims</text>
</svg>
