<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Three-layer cache funnel for CPU-only LLM web search</title>
  <desc id="desc">A query passes through a query cache, a web-result cache, and an LLM-synthesis cache before falling through to a full live crawl and generation, each layer filtering out cheaper hits.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .boxfade { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-dasharray: 5 5; opacity: 0.6; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 13px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="20" y="20" width="120" height="44" rx="8" class="box" />
  <text x="80" y="47" text-anchor="middle" class="txt">User query</text>

  <path d="M140,42 H190" class="arrow" />
  <rect x="190" y="20" width="150" height="44" rx="8" class="boxfill" />
  <text x="265" y="42" text-anchor="middle" class="txt">L1: query cache</text>
  <text x="265" y="57" text-anchor="middle" class="lbl">cheapest hit</text>

  <path d="M265,64 V95" class="arrow" />
  <text x="285" y="82" class="lbl">miss</text>
  <rect x="190" y="95" width="150" height="44" rx="8" class="boxfill" />
  <text x="265" y="117" text-anchor="middle" class="txt">L2: web-result cache</text>

  <path d="M265,139 V170" class="arrow" />
  <text x="285" y="157" class="lbl">miss</text>
  <rect x="190" y="170" width="150" height="44" rx="8" class="boxfill" />
  <text x="265" y="192" text-anchor="middle" class="txt">L3: synthesis cache</text>

  <path d="M265,214 V245" class="arrow" />
  <text x="285" y="232" class="lbl">miss</text>
  <rect x="190" y="245" width="180" height="44" rx="8" class="boxfade" />
  <text x="280" y="267" text-anchor="middle" class="txt">Live crawl + LLM synthesis</text>
  <text x="280" y="282" text-anchor="middle" class="lbl">most expensive path</text>

  <path d="M340,42 H460" class="arrow" />
  <path d="M340,117 L460,60" class="arrow" />
  <path d="M340,192 L460,60" class="arrow" />
  <path d="M370,267 L460,68" class="arrow" />
  <rect x="460" y="20" width="150" height="44" rx="8" class="box" />
  <text x="535" y="47" text-anchor="middle" class="txt">Answer</text>
</svg>
