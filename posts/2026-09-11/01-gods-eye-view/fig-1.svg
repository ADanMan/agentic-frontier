<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Two mismatched star-growth metrics on one trending card</title>
  <desc id="desc">A window-growth figure of plus 916 stars and a separate "1,762 stars today" label refer to the same repo and day but do not reconcile.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 13px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .big { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 15px; font-weight: 600; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="20" y="20" width="270" height="70" rx="8" class="boxfill" />
  <text x="155" y="45" text-anchor="middle" class="txt">Window growth</text>
  <text x="155" y="68" text-anchor="middle" class="big">24,025 → 24,941 (+916)</text>

  <rect x="20" y="150" width="270" height="70" rx="8" class="boxfill" />
  <text x="155" y="175" text-anchor="middle" class="txt">Card label</text>
  <text x="155" y="198" text-anchor="middle" class="big">"+1,762 stars today"</text>

  <path d="M290,55 L420,110" class="arrow" />
  <path d="M290,185 L420,130" class="arrow" />

  <rect x="420" y="90" width="200" height="60" rx="8" class="box" />
  <text x="520" y="115" text-anchor="middle" class="txt">Same repo,</text>
  <text x="520" y="133" text-anchor="middle" class="txt">same day, ~2x gap</text>

  <text x="520" y="175" text-anchor="middle" class="lbl">different counting windows,</text>
  <text x="520" y="192" text-anchor="middle" class="lbl">not a wrong number</text>
</svg>
