<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .prefill { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .decode { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .txt { fill: #1f2937; font-size: 15px; }
    .small { fill: #4b5563; font-size: 12px; }
    .arrow { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#ah3); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111827; }
      .prefill { fill: #1e1b4b; stroke: #818cf8; }
      .decode { fill: #451a03; stroke: #fbbf24; }
      .txt { fill: #e5e7eb; }
      .small { fill: #9ca3af; }
      .arrow { stroke: #9ca3af; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="640" height="280"/>
  <defs>
    <marker id="ah3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" class="txt"/>
    </marker>
  </defs>

  <text class="txt" x="320" y="30" text-anchor="middle" font-size="16">Incoming request</text>
  <path class="arrow" d="M320,40 L320,65"/>

  <rect class="prefill" x="60" y="70" width="220" height="90" rx="8"/>
  <text class="txt" x="170" y="98" text-anchor="middle">Prefill</text>
  <text class="small" x="170" y="118" text-anchor="middle">compute-bound</text>
  <text class="small" x="170" y="136" text-anchor="middle">low-precision arithmetic</text>
  <text class="small" x="170" y="154" text-anchor="middle">speeds up prompt processing</text>

  <rect class="decode" x="360" y="70" width="220" height="90" rx="8"/>
  <text class="txt" x="470" y="98" text-anchor="middle">Decode</text>
  <text class="small" x="470" y="118" text-anchor="middle">memory-bound</text>
  <text class="small" x="470" y="136" text-anchor="middle">compact weights</text>
  <text class="small" x="470" y="154" text-anchor="middle">cuts memory traffic per token</text>

  <path class="arrow" d="M280,115 L360,115"/>
  <text class="small" x="320" y="105" text-anchor="middle">handoff</text>

  <text class="txt" x="320" y="210" text-anchor="middle" font-size="14">Specializing quantization per stage</text>
  <text class="small" x="320" y="230" text-anchor="middle">instead of one scheme for the whole pass</text>
</svg>
