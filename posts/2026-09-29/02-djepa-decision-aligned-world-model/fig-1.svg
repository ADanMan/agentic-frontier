<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .good { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
    .bad { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
    .txt { fill: #1f2937; font-size: 15px; }
    .small { fill: #4b5563; font-size: 12px; }
    .arrow { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#ah2); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111827; }
      .box { fill: #1e1b4b; stroke: #818cf8; }
      .good { fill: #052e16; stroke: #4ade80; }
      .bad { fill: #450a0a; stroke: #f87171; }
      .txt { fill: #e5e7eb; }
      .small { fill: #9ca3af; }
      .arrow { stroke: #9ca3af; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="640" height="320"/>
  <defs>
    <marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" class="txt"/>
    </marker>
  </defs>

  <rect class="box" x="250" y="20" width="140" height="60" rx="8"/>
  <text class="txt" x="320" y="45" text-anchor="middle">current state</text>
  <text class="small" x="320" y="63" text-anchor="middle">latent embedding</text>

  <path class="arrow" d="M300,80 L180,150"/>
  <path class="arrow" d="M340,80 L460,150"/>

  <rect class="box" x="90" y="150" width="180" height="60" rx="8"/>
  <text class="txt" x="180" y="175" text-anchor="middle">candidate action A</text>
  <text class="small" x="180" y="193" text-anchor="middle">predicted latent = close</text>

  <rect class="box" x="370" y="150" width="180" height="60" rx="8"/>
  <text class="txt" x="460" y="175" text-anchor="middle">candidate action B</text>
  <text class="small" x="460" y="193" text-anchor="middle">predicted latent = far</text>

  <path class="arrow" d="M180,210 L180,250"/>
  <path class="arrow" d="M460,210 L460,250"/>

  <rect class="bad" x="90" y="250" width="180" height="50" rx="8"/>
  <text class="txt" x="180" y="280" text-anchor="middle" font-size="13">actually FAILS to execute</text>

  <rect class="good" x="370" y="250" width="180" height="50" rx="8"/>
  <text class="txt" x="460" y="280" text-anchor="middle" font-size="13">actually SUCCEEDS</text>

  <text class="small" x="320" y="315" text-anchor="middle">latent distance ≠ execution success</text>
</svg>
