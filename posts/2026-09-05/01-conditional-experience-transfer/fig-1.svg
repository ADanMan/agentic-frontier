<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Conditional experience transfer</title>
  <desc id="desc">A new post-training round decides whether past experience is relevant enough to transfer, or whether to start fresh.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 13px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; opacity: 0.75; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="20" y="20" width="220" height="46" rx="8" class="box" />
  <text x="130" y="48" text-anchor="middle" class="txt">New task / new domain</text>

  <path d="M240,43 H300" class="arrow" />
  <rect x="300" y="20" width="200" height="46" rx="8" class="box" />
  <text x="400" y="43" text-anchor="middle" class="txt">Is past experience</text>
  <text x="400" y="59" text-anchor="middle" class="txt">relevant here?</text>

  <path d="M340,66 C 310,100 260,110 220,130" class="arrow" />
  <text x="270" y="112" text-anchor="middle" class="lbl">yes</text>
  <rect x="60" y="130" width="200" height="46" rx="8" class="box" />
  <text x="160" y="153" text-anchor="middle" class="txt">Transfer experience</text>
  <text x="160" y="169" text-anchor="middle" class="lbl">faster, but risks old bias</text>

  <path d="M460,66 C 490,100 540,110 580,130" class="arrow" />
  <text x="530" y="112" text-anchor="middle" class="lbl">no</text>
  <rect x="440" y="130" width="200" height="46" rx="8" class="box" />
  <text x="540" y="153" text-anchor="middle" class="txt">Learn fresh</text>
  <text x="540" y="169" text-anchor="middle" class="lbl">slower, but clean</text>

  <text x="320" y="225" text-anchor="middle" class="lbl">The decision itself is the training signal —</text>
  <text x="320" y="242" text-anchor="middle" class="lbl">not just what gets learned, but what gets trusted.</text>
</svg>
