<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
  <title id="title">Fixed-voice TTS versus voice-cloning tradeoff</title>
  <desc id="desc">Low-resource TTS forks into a large flexible voice-cloning model with costly inference, or a compact fixed-voice model trained on synthetic speech with cheaper, more predictable inference.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="15" y="90" width="150" height="55" rx="8" class="boxfill" />
  <text x="90" y="112" text-anchor="middle" class="txt">Low-resource TTS</text>
  <text x="90" y="130" text-anchor="middle" class="lbl">deployment choice</text>

  <path d="M165,105 L240,50" class="arrow" />
  <path d="M165,130 L240,180" class="arrow" />

  <rect x="240" y="20" width="190" height="60" rx="8" class="box" />
  <text x="335" y="45" text-anchor="middle" class="txt">Voice-cloning</text>
  <text x="335" y="63" text-anchor="middle" class="lbl">flexible, costly inference</text>

  <rect x="240" y="150" width="190" height="60" rx="8" class="boxfill" />
  <text x="335" y="172" text-anchor="middle" class="txt">Fixed-voice</text>
  <text x="335" y="190" text-anchor="middle" class="lbl">compact, cheap inference</text>

  <rect x="470" y="150" width="150" height="60" rx="8" class="boxfill" />
  <text x="545" y="172" text-anchor="middle" class="txt">Synthetic speech</text>
  <text x="545" y="190" text-anchor="middle" class="lbl">training data</text>

  <path d="M470,180 L430,180" class="arrow" />
</svg>
