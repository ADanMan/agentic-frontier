<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Discrete structures mapped to a smooth continuous latent space</title>
  <desc id="desc">Discrete structures like decision trees have no smooth neighbor relation, so gradient methods do not apply directly. A VAE encoder maps them to a continuous latent space where nearby points mean similar structures, enabling gradient-based search, then a decoder maps back.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .node { fill: currentColor; opacity: 0.15; stroke: currentColor; stroke-width: 1.5; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 10.5px; opacity: 0.7; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .conn { stroke: currentColor; stroke-width: 1.5; opacity: 0.5; }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="15" y="15" width="270" height="105" rx="8" class="box" />
  <text x="150" y="34" text-anchor="middle" class="txt">Discrete space</text>
  <circle cx="60" cy="75" r="16" class="node" /><text x="60" y="79" text-anchor="middle" class="lbl">tree A</text>
  <circle cx="150" cy="60" r="16" class="node" /><text x="150" y="64" text-anchor="middle" class="lbl">tree B</text>
  <circle cx="230" cy="90" r="16" class="node" /><text x="230" y="94" text-anchor="middle" class="lbl">tree C</text>
  <text x="150" y="112" text-anchor="middle" class="lbl">no smooth neighbor relation</text>

  <rect x="355" y="15" width="270" height="105" rx="8" class="boxfill" />
  <text x="490" y="34" text-anchor="middle" class="txt">Latent space</text>
  <circle cx="410" cy="80" r="7" class="node" />
  <circle cx="450" cy="65" r="7" class="node" />
  <circle cx="500" cy="85" r="7" class="node" />
  <line x1="410" y1="80" x2="450" y2="65" class="conn" />
  <line x1="450" y1="65" x2="500" y2="85" class="conn" />
  <text x="490" y="112" text-anchor="middle" class="lbl">nearby points → similar structures</text>

  <path d="M290,70 L350,70" class="arrow" />
  <text x="320" y="62" text-anchor="middle" class="lbl" font-size="9">encode</text>

  <path d="M350,155 L290,155" class="arrow" />
  <text x="320" y="147" text-anchor="middle" class="lbl" font-size="9">decode</text>

  <rect x="150" y="180" width="340" height="55" rx="8" class="box" />
  <text x="320" y="203" text-anchor="middle" class="txt">Gradient search / interpolation</text>
  <text x="320" y="221" text-anchor="middle" class="lbl">only possible in the continuous space</text>
  <path d="M490,120 L490,180" class="arrow" />
  <path d="M150,180 L150,120" class="conn" />
</svg>
