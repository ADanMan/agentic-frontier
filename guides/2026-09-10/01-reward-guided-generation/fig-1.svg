<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="title desc">
  <title id="title">Reward-guided generation loop</title>
  <desc id="desc">Candidate videos generated from a product condition are scored by a reward signal approximating a business metric, and that score feeds back into generation.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 13px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .dash { stroke: currentColor; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; marker-end: url(#arrow); opacity: 0.6; }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="20" y="110" width="160" height="50" rx="8" class="box" />
  <text x="100" y="132" text-anchor="middle" class="txt">Product +</text>
  <text x="100" y="150" text-anchor="middle" class="txt">conditions</text>

  <path d="M180,135 H230" class="arrow" />
  <rect x="230" y="110" width="150" height="50" rx="8" class="box" />
  <text x="305" y="132" text-anchor="middle" class="txt">Video generator</text>
  <text x="305" y="150" text-anchor="middle" class="lbl">agentic loop</text>

  <path d="M380,120 L430,60" class="arrow" />
  <path d="M380,135 H430" class="arrow" />
  <path d="M380,150 L430,210" class="arrow" />

  <rect x="430" y="40" width="150" height="36" rx="8" class="boxfill" />
  <text x="505" y="63" text-anchor="middle" class="txt">Candidate A</text>

  <rect x="430" y="117" width="150" height="36" rx="8" class="boxfill" />
  <text x="505" y="140" text-anchor="middle" class="txt">Candidate B</text>

  <rect x="430" y="194" width="150" height="36" rx="8" class="boxfill" />
  <text x="505" y="217" text-anchor="middle" class="txt">Candidate C</text>

  <path d="M505,76 V240" class="arrow" />
  <path d="M505,153 V240" class="arrow" />
  <path d="M505,230 V240" class="arrow" />

  <rect x="400" y="240" width="210" height="36" rx="8" class="box" />
  <text x="505" y="263" text-anchor="middle" class="txt">Reward ≈ business metric</text>

  <path d="M400,258 H180" class="dash" />
  <text x="290" y="248" text-anchor="middle" class="lbl">feeds back into generation</text>
</svg>
