<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Signal-coherent vs. scene-coherent gesture</title>
  <desc id="desc">A gesture generated from speech alone can be well-timed but clip through objects in the scene. Object-grounded, posture-aware generation accounts for the physical environment too.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 13px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="20" y="110" width="140" height="46" rx="8" class="box" />
  <text x="90" y="138" text-anchor="middle" class="txt">Speech audio</text>

  <path d="M160,133 H220" class="arrow" />
  <rect x="220" y="110" width="150" height="46" rx="8" class="box" />
  <text x="295" y="132" text-anchor="middle" class="txt">Gesture model</text>
  <text x="295" y="148" text-anchor="middle" class="lbl">speech → motion</text>

  <path d="M370,120 L440,60" class="arrow" />
  <path d="M370,146 L440,210" class="arrow" />

  <rect x="440" y="30" width="180" height="60" rx="8" class="boxfill" />
  <text x="530" y="52" text-anchor="middle" class="txt">Signal-coherent only</text>
  <text x="530" y="70" text-anchor="middle" class="lbl">synced, but clips</text>
  <text x="530" y="84" text-anchor="middle" class="lbl">through the desk</text>

  <rect x="440" y="185" width="180" height="60" rx="8" class="box" />
  <text x="530" y="207" text-anchor="middle" class="txt">Object-grounded +</text>
  <text x="530" y="223" text-anchor="middle" class="txt">posture-aware</text>
  <text x="530" y="239" text-anchor="middle" class="lbl">Puppeteer's claim</text>
</svg>
