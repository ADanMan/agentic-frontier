<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Rounding error propagates differently through a linear layer than through softmax</title>
  <desc id="desc">A number rounded from fp16 to int4 carries a rounding error. Summed across a linear layer's many weights that error partly cancels out, but the same error before a softmax can noticeably shift which tokens receive attention.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .boxwarn { fill: currentColor; opacity: 0.16; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 13px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="20" y="130" width="160" height="50" rx="8" class="box" />
  <text x="100" y="152" text-anchor="middle" class="txt">fp16 number</text>
  <text x="100" y="169" text-anchor="middle" class="lbl">~65,000 levels</text>

  <path d="M180,155 H240" class="arrow" />
  <rect x="240" y="130" width="160" height="50" rx="8" class="boxfill" />
  <text x="320" y="152" text-anchor="middle" class="txt">int4 rounding</text>
  <text x="320" y="169" text-anchor="middle" class="lbl">16 levels, bigger error</text>

  <path d="M400,140 L470,60" class="arrow" />
  <path d="M400,170 L470,230" class="arrow" />

  <rect x="470" y="20" width="150" height="70" rx="8" class="boxfill" />
  <text x="545" y="45" text-anchor="middle" class="txt">Linear layer</text>
  <text x="545" y="63" text-anchor="middle" class="lbl">errors partly cancel</text>
  <text x="545" y="79" text-anchor="middle" class="lbl">across many weights</text>

  <rect x="470" y="200" width="150" height="70" rx="8" class="boxwarn" />
  <text x="545" y="225" text-anchor="middle" class="txt">Softmax</text>
  <text x="545" y="243" text-anchor="middle" class="lbl">error shifts which token</text>
  <text x="545" y="259" text-anchor="middle" class="lbl">gets attention</text>
</svg>
