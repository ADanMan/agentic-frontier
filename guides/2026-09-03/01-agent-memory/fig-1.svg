<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Three layers of agent memory, each with its own cost</title>
  <desc id="desc">Working memory costs tokens per call, episodic memory costs deciding what to forget as a session grows, and long-term memory costs storage, indexing, and retrieval engineering.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 14px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; opacity: 0.75; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="20" y="20" width="150" height="50" rx="8" class="box" />
  <text x="95" y="50" text-anchor="middle" class="txt">Рабочая память</text>

  <rect x="245" y="20" width="150" height="50" rx="8" class="box" />
  <text x="320" y="42" text-anchor="middle" class="txt">Эпизодическая</text>
  <text x="320" y="58" text-anchor="middle" class="txt">память</text>

  <rect x="470" y="20" width="150" height="50" rx="8" class="box" />
  <text x="545" y="42" text-anchor="middle" class="txt">Долговременная</text>
  <text x="545" y="58" text-anchor="middle" class="txt">память</text>

  <path d="M95,70 V110" class="arrow" />
  <path d="M320,70 V110" class="arrow" />
  <path d="M545,70 V110" class="arrow" />

  <rect x="20" y="110" width="150" height="70" rx="8" class="box" />
  <text x="95" y="138" text-anchor="middle" class="lbl">Цена:</text>
  <text x="95" y="156" text-anchor="middle" class="lbl">токены в каждом</text>
  <text x="95" y="172" text-anchor="middle" class="lbl">вызове</text>

  <rect x="245" y="110" width="150" height="70" rx="8" class="box" />
  <text x="320" y="138" text-anchor="middle" class="lbl">Цена:</text>
  <text x="320" y="156" text-anchor="middle" class="lbl">что забыть по</text>
  <text x="320" y="172" text-anchor="middle" class="lbl">мере роста сессии</text>

  <rect x="470" y="110" width="150" height="70" rx="8" class="box" />
  <text x="545" y="138" text-anchor="middle" class="lbl">Цена:</text>
  <text x="545" y="156" text-anchor="middle" class="lbl">хранение, индекс,</text>
  <text x="545" y="172" text-anchor="middle" class="lbl">извлечение</text>

  <line x1="20" y1="215" x2="620" y2="215" stroke="currentColor" stroke-width="1" opacity="0.25" />
  <text x="320" y="245" text-anchor="middle" class="txt">"Сколько памяти нужно" — три разных ответа,</text>
  <text x="320" y="265" text-anchor="middle" class="txt">не один общий бюджет токенов</text>
</svg>
