<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Dense vs MoE layer offloading</title>
  <desc id="desc">A dense layer uses 100% of its weights per token, so offloading it to disk requires disk access on every token. An MoE layer uses only 1-2 of N experts per token, so only those need loading from disk.</desc>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; }
    .boxfill { fill: currentColor; opacity: 0.08; stroke: currentColor; stroke-width: 2; }
    .boxfill-dim { fill: currentColor; opacity: 0.04; stroke: currentColor; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .txt { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; }
    .lbl { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 11px; opacity: 0.7; }
    .big { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 13px; font-weight: 600; }
    .hdr { fill: currentColor; font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 13px; font-weight: 700; }
    svg { color: #1f2430; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e6e6; } }
  </style>

  <text x="150" y="24" text-anchor="middle" class="hdr">Dense layer</text>
  <rect x="20" y="40" width="80" height="50" rx="6" class="boxfill" />
  <rect x="105" y="40" width="80" height="50" rx="6" class="boxfill" />
  <rect x="190" y="40" width="80" height="50" rx="6" class="boxfill" />
  <text x="60" y="70" text-anchor="middle" class="txt">weights</text>
  <text x="145" y="70" text-anchor="middle" class="txt">weights</text>
  <text x="230" y="70" text-anchor="middle" class="txt">weights</text>
  <text x="150" y="110" text-anchor="middle" class="lbl">100% of weights used, every token</text>
  <text x="150" y="128" text-anchor="middle" class="big">offload → disk hit every token</text>

  <line x1="0" y1="155" x2="640" y2="155" class="box" stroke-dasharray="2 4" />

  <text x="150" y="180" text-anchor="middle" class="hdr">MoE layer (N experts, router picks 1-2)</text>
  <rect x="20" y="196" width="70" height="46" rx="6" class="boxfill" />
  <text x="55" y="223" text-anchor="middle" class="txt">expert 3</text>
  <rect x="98" y="196" width="70" height="46" rx="6" class="boxfill-dim" />
  <text x="133" y="223" text-anchor="middle" class="txt">expert 4</text>
  <rect x="176" y="196" width="70" height="46" rx="6" class="boxfill-dim" />
  <text x="211" y="223" text-anchor="middle" class="txt">expert 5</text>
  <rect x="254" y="196" width="70" height="46" rx="6" class="boxfill" />
  <text x="289" y="223" text-anchor="middle" class="txt">expert 6</text>
  <rect x="332" y="196" width="70" height="46" rx="6" class="boxfill-dim" />
  <text x="367" y="223" text-anchor="middle" class="txt">... N</text>
  <text x="210" y="266" text-anchor="middle" class="lbl">solid = selected by router, loaded from disk · dashed = stays on disk</text>
  <text x="210" y="286" text-anchor="middle" class="big">offload → disk hit only for 1-2 of N</text>
</svg>
