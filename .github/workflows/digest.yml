name: daily-digest

# Runs on a GitHub-hosted runner, where outbound internet is open — unlike the
# cloud post-routine's sandbox, which blocks egress to arXiv/RSS/HF. This job
# fetches today's digest (digest.py needs NO API key) and commits it, so the post
# routine has fresh sources to write from. Fires ~1h before the post window.

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 08:00 Moscow (post routine starts 06:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's digest
        env:
          GH_TOKEN: ${{ github.token }}   # lets digest.py's `gh` repo query work
        run: python3 scripts/digest.py

      - name: Commit & push if there's a new digest
        run: |
          git config user.name "Danila Katalshov"
          git config user.email "56929384+ADanMan@users.noreply.github.com"
          if [ -n "$(git status --porcelain digests/)" ]; then
            git add digests/
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No new digest to commit."
          fi
