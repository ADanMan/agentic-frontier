name: daily-post

# Openly automated: generates one AI explainer post per day and commits it.
# Commits are authored as the repo owner (no Claude co-author), so they count as
# real contributions — the content is real explainers, not empty commits.

on:
  workflow_dispatch: {}      # manual-only; the daily schedule is handled by a
                             # cloud routine (see README "How it runs"), so this
                             # Action doesn't double-post. Needs ANTHROPIC_API_KEY
                             # secret if you do run it.

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEN_MODEL: claude-sonnet-5
        run: python3 scripts/generate.py

      - name: Commit & push if there's a new post
        run: |
          git config user.name "Danila Katalshov"
          git config user.email "56929384+ADanMan@users.noreply.github.com"
          if [ -n "$(git status --porcelain posts/)" ]; then
            git add posts/
            git commit -m "post: $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No new post to commit."
          fi
